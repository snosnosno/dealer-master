var FLIGHT = null;
var SWEEP = false;        // 라운드가 끝나 칩을 쓸어담기 직전의 뜸

function busyLabel() {
  return SWEEP ? '라운드 종료 — 칩 수거' : ((FLIGHT && FLIGHT.label) || '딜링 중');
}

function flyDeal(plan, done) {
  runFlight(plan.map(function (p) {
    if (p.board) return { to: '[data-board]', commit: function () { H.board.push(draw1()); } };
    return { to: '[data-seat="' + p.seat + '"]', commit: function () {
      var s = H.seats[p.seat];
      if (p.up) s.up.push(draw1());
      else if (p.replace) { s.down[rnd(s.down.length)] = draw1(); }
      else s.down.push(draw1());
    } };
  }), done);
}

/* 좌석 앞에 쌓인 칩을 팟으로 옮긴다.
   첫 칩이 뜰 때 좌석이 비고, 마지막 칩이 닿을 때 팟이 커진다 —
   공중의 칩이 어느 쪽에도 두 번 세어지지 않게 하려는 것이다. */
function chipItem(s, denom, first, last, amt) {
  return {
    from: '[data-seat="' + s.i + '"]', to: '.pot',
    cls: 'chip c' + denom + ' flier', w: 14, h: 14,
    commit: function () { if (first) s.bet = 0; if (last) H.pot += amt; }
  };
}
/* 칩은 라운드가 끝나야 수거한다. 놓인 것을 볼 시간을 주고 쓸어담는다. */
function sweepChips(done) {
  if (!betsOut()) return done();
  PHASE = 'anim';
  SWEEP = true;
  render();
  setTimeout(function () {
    SWEEP = false;
    log('라운드 종료 — 앞에 놓인 <b>' + won(betsOut()) + '</b> 을 팟으로 수거');
    flyChips(done);
  }, 640);
}

function flyChips(done) {
  var list = H.seats.filter(function (s) { return s.bet > 0; });
  if (!list.length) { done(); return; }
  var items = [], i, k, cs, amt;
  for (i = 0; i < list.length; i++) {
    amt = list[i].bet;
    cs = chipBreak(amt);
    for (k = 0; k < cs.length; k++) {
      items.push(chipItem(list[i], cs[k], k === 0, k === cs.length - 1, amt));
    }
  }
  runFlight(items, done, '칩을 팟으로 모으는 중');
}

function flyTo(pileId, n, done) {
  var arr = [], i;
  for (i = 0; i < n; i++) arr.push({ to: '[data-pile="' + pileId + '"]', commit: function () { H.di++; } });
  runFlight(arr, done);
}

function runFlight(items, done, label) {
  if (!items.length) { done(); return; }
  var f = { items: items, idx: 0, landed: 0, dead: false, done: done, label: label || '딜링 중' };
  FLIGHT = f;
  PHASE = 'anim';
  render();

  f.timer = setInterval(function () {
    if (f.dead) return;
    if (f.idx >= f.items.length) { clearInterval(f.timer); return; }
    launch(f, f.items[f.idx++]);
  }, 62);
  launch(f, f.items[f.idx++]);
}

function launch(f, it) {
  var src = document.querySelector(it.from || '[data-pile="stub"]');
  var dst = document.querySelector(it.to);
  if (!src || !dst) { it.commit(); afterLand(f); return; }
  var a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
  var el = document.createElement('span');
  el.className = it.cls || 'pcard back flier';
  var w = it.w || 22, hh = it.h || 30;
  el.style.left = (a.left + a.width / 2 - w / 2) + 'px';
  el.style.top = (a.top + a.height / 2 - hh / 2) + 'px';
  el.style.transform = 'translate(0,0)';
  $('#fly').appendChild(el);
  var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  var dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; });
  });
  var fired = false;
  function land() {
    if (fired) return; fired = true;
    if (el.parentNode) el.parentNode.removeChild(el);
    if (f.dead) return;
    commitOnce(it); render(); afterLand(f);
  }
  el.addEventListener('transitionend', land);
  setTimeout(land, 320);
}

/* 같은 카드를 두 번 커밋하지 않는다. 건너뛰기가 공중의 카드를 가로챌 수 있어서다. */
function commitOnce(it) {
  if (it.committed) return;
  it.committed = true;
  it.commit();
}

function afterLand(f) {
  f.landed++;
  if (f.landed >= f.items.length) { FLIGHT = null; f.done(); }
}

function skipFlight() {
  var f = FLIGHT;
  if (!f) return;
  f.dead = true;
  clearInterval(f.timer);
  var layer = $('#fly');
  while (layer.firstChild) layer.removeChild(layer.firstChild);
  // 공중에 있던 것도, 아직 안 뜬 것도 전부 커밋한다
  for (var i = 0; i < f.items.length; i++) commitOnce(f.items[i]);
  FLIGHT = null;
  render();
  f.done();
}

// ═══════════════════════════════════════════════════
// 채점
// ═══════════════════════════════════════════════════
function judge(ok, step, extra) {
  if (step.after) step.after(ok);
  if (ok) { G.right++; log('판단 정답', ''); }
  else {
    G.wrong++; G.lives--;
    log('판단 오답 — 생명 ' + G.lives, 'bad');
  }
  VERDICT = { ok: ok, why: step.why, cite: step.cite, extra: extra || '' };
  PHASE = 'verdict';
  render();
  if (G.lives <= 0) {
    G.over = true;
    if (G.hands - 1 > best) { best = G.hands - 1; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    render();   // 왜 죽었는지 먼저 읽게 두고, 결과는 버튼으로 넘어간다
    return;
  }
  /* 정답이어도 자동으로 넘어가지 않는다 — 근거를 읽을 시간은 사용자가 정한다 */
}

function nextAfterVerdict() {
  /* 자동 진행 타이머와 「계속」 클릭이 겹치면 스텝을 하나 건너뛴다 */
  if (PHASE !== 'verdict') return;
  VERDICT = null; STEP = null; H.flags.hotSeat = null; H.flags.reveal = null;
  PHASE = 'idle'; render(); advance();
}

// 선택지 클릭
function onChoice(i) {
  if (PHASE === 'popenbet') { onPBet(i); return; }
  if (PHASE === 'pchoice') { onPChoice(i); return; }
  var s = STEP;
  if (!s) return;
  /* 2단계 — 좌석은 이미 맞혔고 금액만 남았다 */
  if (PHASE === 'openbet') {
    s.picked = i;
    judge(i === s.bet.correct, s);
    return;
  }
  if (PHASE !== 'ask') return;
  s.picked = i;
  if (i !== s.correct) { judge(false, s); return; }
  if (s.target) { PHASE = 'target'; render(); return; }
  judge(true, s);
}

/* 팟리밋은 선택지가 없다 — 숫자를 받는다. 쉼표는 지우고 읽는다. */
function submitAmount() {
  var el = $('#amtin');
  if (!el) return;
  var raw = String(el.value).replace(/[^0-9]/g, '');
  if (!raw.length) return;
  var v = parseInt(raw, 10);
  if (PHASE === 'popenbet' || PHASE === 'pamount') { onPAmount(v); return; }
  onAmount(v);
}

function onAmount(v) {
  var s = STEP;
  if (!s) return;
  if (PHASE === 'openbet' && s.bet) {
    s.typed = v;
    judge(v === s.bet.amount, s, v === s.bet.amount ? '' : won(v) + ' 을 냈다.');
    return;
  }
  if (PHASE === 'ask' && s.kind === 'amount') {
    s.typed = v;
    judge(v === s.amount, s, v === s.amount ? '' : won(v) + ' 을 냈다.');
  }
}

// 좌석 클릭
function onSeat(i) {
  if (PHASE === 'popen' || PHASE === 'pwin' || PHASE === 'ptarget') { onPSeat(i); return; }
  var s = STEP;
  if (!s) return;
  if (PHASE === 'ask' && s.kind === 'seat') { judge(i === s.answer, s); return; }
  if (PHASE === 'ask' && s.kind === 'open') {
    if (i !== s.answer) { judge(false, s); return; }
    s.seatPicked = i;
    log(H.seats[i].name + ' — 첫 액션');
    if (!s.bet) { judge(true, s); return; }
    /* 금액 단계로 넘어가면 채점 근거도 금액 쪽으로 바뀐다 */
    s.why = s.bet.why; s.cite = s.bet.cite;
    PHASE = 'openbet'; render(); return;
  }
  if (PHASE === 'target' && s.target && s.target.kind === 'seat') {
    judge(i === s.target.answer, s,
      i === s.target.answer ? '' : '절차는 맞았지만 지목이 틀렸다.');
    return;
  }
}

// 더미 클릭
function onPile(id) {
  var s = STEP;
  if (!s || PHASE !== 'target' || !s.target || s.target.kind !== 'pile') return;
  judge(id === s.target.answer, s,
    id === s.target.answer ? '' : '절차는 맞았지만 어디로 보낼지가 틀렸다.');
}

// ═══════════════════════════════════════════════════
// 연습 모드 — 문제가 주어지지 않는다. 순서를 스스로 짠다.
//
// 팔레트는 항상 같다. 상황마다 보기가 새로 나오는 것이 아니라
// 딜러가 할 수 있는 행동 전부가 늘 떠 있고, 그중 무엇을 먼저 할지를 고른다.
// 그것이 4지선다와 갈리는 지점이다.
// ═══════════════════════════════════════════════════
var P = null;

var ACTS = [
  { id: 'ante',    ko: '앤티 수거' },
  { id: 'blinds',  ko: '블라인드 수거' },
  { id: 'burn',    ko: '번카드' },
  { id: 'deal',    ko: '카드 딜' },
  { id: 'draw',    ko: '카드 교체' },
  { id: 'open',    ko: '브링인 / 첫 순서 지목' },
  { id: 'betting', ko: '베팅 진행' },
  { id: 'pot',     ko: '팟 지급' }
];

function startPractice(specId) {
  var spec = SPECS[specId];
  var deck = newDeck(), seats = [], i;
  var btn = rnd(SEAT_N);
  for (i = 0; i < SEAT_N; i++) {
    seats.push({ i: i, name: (i + 1) + '번', pos: (i - btn + SEAT_N) % SEAT_N,
      down: [], up: [], folded: false, declared: 0, given: 0, bet: 0 });
  }
  H = { spec: spec, seats: seats, deck: deck, di: 0, btn: btn, pot: 0, burns: 0,
        discards: 0, board: [], stage: '', stageIdx: -1, log: [], flags: {}, q: [], qi: 0 };
  P = { steps: pSteps(spec), pi: 0, stuck: 0, msg: '', ask: null, finished: false, specId: specId };
  /* 팟리밋 계산은 베팅이 한 번 돈 뒤에 낸다 — 그래야 콜 금액이 생긴다 */
  P.potAt = -1;
  if (spec.betting === 'PL' && spec.streets.length > 1) P.potAt = 1 + rnd(spec.streets.length - 1);
  G.mode = 'practice';
  G.started = true;
  PHASE = 'practice';
  log('연습 시작 — ' + spec.ko, 'hi');
  render();
}

function pSteps(spec) {
  var out = [], k;
  out.push({ act: spec.forced === 'ante+bringin' ? 'ante' : 'blinds', ix: -1 });
  for (k = 0; k < spec.streets.length; k++) {
    var st = spec.streets[k];
    if (st.burn) out.push({ act: 'burn', ix: k });
    out.push({ act: st.draw ? 'draw' : 'deal', ix: k });
    out.push({ act: 'open', ix: k });
    out.push({ act: 'betting', ix: k });
  }
  out.push({ act: 'pot', ix: -1 });
  return out;
}

/* 틀렸을 때 무엇을 먼저 해야 하는지 한 줄로 말해 준다. 가리지 않는다 — 연습이다. */
function pDeny(exp) {
  var spec = H.spec;
  if (exp.act === 'ante') return '아직 앤티를 걷지 않았다. 스터드는 앤티와 브링인으로 시작한다.';
  if (exp.act === 'blinds') return '아직 블라인드를 걷지 않았다. 드로우게임은 SB·BB 로 시작한다.';
  if (exp.act === 'burn') return spec.streets[exp.ix].ko + ' 전에 번카드를 내린다.';
  if (exp.act === 'deal') return spec.streets[exp.ix].ko + '를 아직 딜하지 않았다.';
  if (exp.act === 'draw') return spec.streets[exp.ix].ko + ' 교체가 아직이다.';
  if (exp.act === 'open') return (spec.family === 'stud' && exp.ix === 0)
    ? '아직 브링인을 지목하지 않았다 — 누가 브링인이고 얼마를 내는지 정한다.'
    : '이번 라운드의 첫 순서를 아직 지목하지 않았다 — 누가 먼저 액션하는지와 벳 크기를 정한다.';
  if (exp.act === 'betting') return '베팅을 아직 진행하지 않았다.';
  return '마지막은 팟 지급이다.';
}

function onPalette(act) {
  if (!P || PHASE !== 'practice' || P.finished) return;
  var exp = P.steps[P.pi];
  if (act !== exp.act) {
    P.stuck++;
    P.msg = pDeny(exp);
    log('순서 아님 — ' + P.msg, 'bad');
    render();
    return;
  }
  P.msg = '';
  pRun(exp);
}

function pRun(step) {
  var spec = H.spec, ix = step.ix;
  if (ix >= 0) { H.stageIdx = ix; H.stage = spec.streets[ix].ko; }

  if (step.act === 'ante' || step.act === 'blinds') return doForced(pDone);
  if (step.act === 'burn') {
    return flyTo('burn', 1, function () {
      H.burns++; log('번카드 <b>1장</b> (누적 ' + H.burns + '장)'); pDone();
    });
  }
  if (step.act === 'deal') return doDeal(ix, pDone);
  if (step.act === 'draw') return doDrawRound(ix, pDone);
  if (step.act === 'betting') {
    /* 팟리밋 계산은 벳이 화면에 놓인 채로 물어야 한다 — 베팅보다 먼저 낸다.
       mkPotRaise 가 벳을 실제로 놓으므로, 답한 뒤 그 라운드가 이어서 굴러간다. */
    if (ix === P.potAt) {
      var pr = mkPotRaise(ix);
      if (pr) {
        P.ask = pr; P.msg = '';
        P.afterAsk = function () { doBets(ix, pDone); };
        PHASE = 'pamount'; render();
        return;
      }
    }
    return doBets(ix, pDone);
  }
  if (step.act === 'pot') {
    H.showdown = true;
    log('쇼다운 — 카드를 공개한다', 'hi');
    P.tail = [];
    var w = mkAskWinner();
    if (w) P.tail.push(w);
    var lw = mkAskLow();
    if (lw) P.tail.push(lw);
    if (!P.tail.length) { log(payoutLine(), 'hi'); P.finished = true; PHASE = 'pdone'; render(); return; }
    pAskNext(); return;
  }
  if (step.act === 'open') {
    var a = mkAskOpen(ix);
    if (!a) { log('첫 액션이 동률이라 이 라운드는 묻지 않는다'); return pDone(); }
    P.ask = a; PHASE = 'popen'; render(); return;
  }
}

function pDone() {
  P.pi++;
  P.ask = null;
  pSkipAuto();
  PHASE = P.pi >= P.steps.length ? 'pdone' : 'practice';
  render();
}

/* 물을 것이 없는 라운드는 팔레트를 누르게 하지 않는다 —
   눌러 봐야 「동률이라 묻지 않는다」 한 줄뿐이라 손만 한 번 더 가는 것이다.
   첫 액션이 자동으로 정해지는 라운드가 여기 해당한다. */
function pSkipAuto() {
  for (var guard = 0; guard < 8; guard++) {
    var st = P.steps[P.pi];
    if (!st || st.act !== 'open') return;
    if (mkAskOpen(st.ix)) return;
    log('첫 액션이 저절로 정해진다 — 지목 없이 넘어간다');
    P.pi++;
  }
}

/* 쇼다운은 판단이 하나가 아닐 수 있다 (스플릿). 남은 판단을 차례로 낸다. */
function pAskNext() {
  if (!P.tail || !P.tail.length) {
    log(payoutLine(), 'hi');
    P.finished = true; P.pi = P.steps.length; PHASE = 'pdone'; render(); return;
  }
  P.ask = P.tail.shift();
  P.msg = '';
  PHASE = P.ask.kind === 'seat' ? 'pwin' : 'pchoice';
  render();
}
function pRecord(name) {
  if (!P.wins) P.wins = [];
  P.wins.push({ name: name, kicker: P.ask.kicker, why: P.ask.why, cite: P.ask.cite });
}

function onPSeat(i) {
  if (!P || !P.ask) return;
  if (PHASE === 'popen') {
    if (i !== P.ask.answer) { pMiss('그 좌석이 아니다. '); return; }
    P.msg = '';
    P.ask.seatPicked = i;
    log(H.seats[i].name + ' 첫 액션');
    if (!P.ask.bet) { pDone(); return; }
    PHASE = 'popenbet'; render();
    return;
  }
  if (PHASE === 'pwin') {
    if (i === P.ask.answer) { pRecord(H.seats[i].name); P.msg = ''; pAskNext(); }
    else { pMiss('그 좌석이 아니다. '); }
    return;
  }
  if (PHASE === 'ptarget') {
    if (i === P.ask.target.answer) { pRecord(H.seats[i].name); P.msg = ''; pAskNext(); }
    else { pMiss('그 좌석이 아니다. '); }
    return;
  }
}
function pMiss(head) {
  P.stuck++;
  P.msg = head + P.ask.why;
  log('오답 — ' + P.ask.kicker, 'bad');
  render();
}
function onPChoice(i) {
  if (!P || !P.ask) return;
  if (i !== P.ask.correct) { pMiss('그 답이 아니다. '); return; }
  P.msg = '';
  if (P.ask.target) { PHASE = 'ptarget'; render(); return; }
  pRecord('');
  pAskNext();
}

function onPBet(i) {
  if (!P || !P.ask || !P.ask.bet) return;
  var b = P.ask.bet;
  if (i === b.correct) { log(b.choices[i] + ' 선언'); P.msg = ''; pDone(); return; }
  P.stuck++;
  P.msg = '그 크기가 아니다. ' + b.why;
  log('벳 크기 오답', 'bad');
  render();
}

function onPAmount(v) {
  if (!P || !P.ask) return;
  var b = P.ask.bet || P.ask;
  if (v === b.amount) {
    log('팟벳 <b>' + won(v) + '</b> 선언');
    P.msg = '';
    H.flags.hotSeat = null;
    var after = P.afterAsk;
    if (after) {
      /* 판단이 끝났으니 화면부터 판단 상태에서 빼낸다 —
         이어지는 베팅이 render 를 부르는데 P.ask 는 이미 없다. */
      P.afterAsk = null; P.ask = null; PHASE = 'practice';
      return after();
    }
    pDone();
    return;
  }
  P.stuck++;
  P.msg = won(v) + ' 이 아니다. ' + b.why;
  log('팟벳 계산 오답', 'bad');
  render();
}

function practiceTopHTML() {
  return '<div class="top">' +
    '<span class="game">' + H.spec.ko + '</span>' +
    '<span class="fam">연습 모드</span>' +
    '<span class="spacer"></span>' +
    '<span class="kv">단계 <b>' + Math.min(P.pi + 1, P.steps.length) + '</b>/' + P.steps.length + '</span>' +
    '<span class="kv">막힘 <b>' + P.stuck + '</b></span>' +
    '</div>';
}

function practicePanelHTML() {
  var h = '';
  if (PHASE === 'anim') {
    return '<div class="panel"><div class="kicker">' + busyLabel() + '</div><div class="q">' + H.stage +
      '</div><div class="hint">화면을 클릭하면 건너뜁니다</div></div>';
  }
  if (PHASE === 'pdone') {
    return '<div class="panel done">' +
      '<div class="kicker">한 핸드 완주</div>' +
      '<div class="big">' + P.stuck + '</div>' +
      '<div class="cap">번 막혔습니다</div>' +
      (P.wins || []).map(function (w) {
        return '<div class="verdict ok" style="text-align:left;margin-top:12px">' +
          '<div class="hd">' + w.kicker + (w.name ? ' — ' + w.name : '') + '</div>' + w.why +
          (w.cite ? '<div class="cite"><b>' + w.cite.src + '</b> — ' + w.cite.txt + '</div>' : '') +
          '</div>';
      }).join('') +
      '<div class="qsub" style="text-align:center;margin-top:8px">' +
      (P.stuck === 0
        ? '한 번도 순서를 틀리지 않았습니다.'
        : '막힐 때마다 무엇이 먼저였는지 로그에 남아 있습니다.') + '</div>' +
      '<button class="btn" id="pagain" style="max-width:320px;margin:16px auto 0">같은 종목 한 핸드 더</button>' +
      '<button class="btn ghostbtn" id="pother" style="max-width:320px;margin:8px auto 0">' +
      SPECS[ROTATION[(ROTATION.indexOf(P.specId) + 1) % ROTATION.length]].ko + ' 로 바꾸기</button>' +
      '<button class="btn ghostbtn" id="phome" style="max-width:320px;margin:8px auto 0">처음 화면으로</button>' +
      '</div>';
  }
  if ((PHASE === 'popen' || PHASE === 'pwin') && P.ask) {
    h = '<div class="panel"><div class="kicker">' + (PHASE === 'pwin' ? P.ask.kicker : (P.ask.openKo || '첫 순서 지목') + ' · 1단계') + '</div>' +
      '<div class="q">' + P.ask.q + '</div>' +
      '<div class="qsub">' + (PHASE === 'pwin' ? '쇼다운' : H.stage) + ' · 테이블에서 좌석을 클릭하세요.</div>';
    if (P.msg) h += '<div class="verdict no"><div class="hd">아직 아니다</div>' + P.msg + '</div>';
    return h + '</div>';
  }
  if (PHASE === 'ptarget' && P.ask) {
    h = '<div class="panel"><div class="kicker">' + P.ask.kicker + '</div>' +
      '<div class="q">' + P.ask.target.prompt + '</div>' +
      '<div class="qsub">테이블에서 좌석을 클릭하세요.</div>';
    if (P.msg) h += '<div class="verdict no"><div class="hd">아직 아니다</div>' + P.msg + '</div>';
    return h + '</div>';
  }
  if (PHASE === 'pchoice' && P.ask) {
    h = '<div class="panel"><div class="kicker">' + P.ask.kicker + '</div>' +
      '<div class="q">' + P.ask.q + '</div>' +
      (P.ask.sub ? '<div class="qsub">' + P.ask.sub + '</div>' : '') +
      '<div class="choices">';
    for (var qi = 0; qi < P.ask.choices.length; qi++) {
      h += '<button class="ch" data-ch="' + qi + '">' + P.ask.choices[qi] + '</button>';
    }
    h += '</div>';
    if (P.msg) h += '<div class="verdict no"><div class="hd">아직 아니다</div>' + P.msg + '</div>';
    return h + '</div>';
  }
  if (PHASE === 'pamount' && P.ask) {
    h = '<div class="panel"><div class="kicker">' + P.ask.kicker + '</div>' +
      '<div class="q">' + P.ask.q + '</div>' +
      (P.ask.sub ? '<div class="qsub">' + P.ask.sub + '</div>' : '') +
      amtHTML(P.ask, true, null);
    if (P.msg) h += '<div class="verdict no"><div class="hd">아직 아니다</div>' + P.msg + '</div>';
    return h + '</div>';
  }
  if (PHASE === 'popenbet' && P.ask) {
    var b = P.ask.bet;
    h = '<div class="panel"><div class="kicker">' + (P.ask.openKo || '첫 순서 지목') + ' · 2단계</div>' +
      '<div class="picked" style="margin-top:0;padding-top:0;border-top:none">첫 액션 — ' +
      H.seats[P.ask.seatPicked].name + ' 지목 완료</div>' +
      '<div class="q" style="margin-top:8px">' + b.q + '</div>' +
      (b.sub ? '<div class="qsub">' + b.sub + '</div>' : '');
    h += b.input === 'amount' ? amtHTML(b, true, null) : choiceHTML(b.choices, true, -1, -1);
    if (P.msg) h += '<div class="verdict no"><div class="hd">아직 아니다</div>' + P.msg + '</div>';
    return h + '</div>';
  }
  h = '<div class="panel"><div class="kicker">다음에 할 일을 고르세요</div>' +
    '<div class="q">' + (H.stage || '핸드 시작') + '</div>' +
    '<div class="qsub">목록은 항상 같습니다. 순서는 당신이 짜세요.</div>' +
    '<div class="choices palette">';
  for (var i = 0; i < ACTS.length; i++) {
    h += '<button class="ch" data-act="' + ACTS[i].id + '">' + ACTS[i].ko + '</button>';
  }
  h += '</div>';
  if (P.msg) h += '<div class="verdict no"><div class="hd">순서가 아니다</div>' + P.msg + '</div>';
  return h + '</div>';
}

// ═══════════════════════════════════════════════════
// 화면
// ═══════════════════════════════════════════════════
function render() {
  var app = $('#app');
  if (!G.started) { app.innerHTML = introHTML(); wire(); return; }
  if (G.mode === 'practice') {
    app.innerHTML = practiceTopHTML() + boardHTML() + practicePanelHTML() + logHTML();
    wire(); return;
  }
  if (G.over && G.showEnd) { app.innerHTML = doneHTML(); wire(); return; }
  app.innerHTML = topHTML() + boardHTML() + panelHTML() + logHTML();
  wire();
}

function introHTML() {
  var h = '<div class="panel done">' +
    '<div class="kicker">축 3 프로토타입 · 3번째 판본</div>' +
    '<div style="font-size:27px;font-weight:900;letter-spacing:-.02em;margin:6px 0 4px">딜링 룸</div>' +
    '<div style="font-size:13.5px;color:var(--ink-2);line-height:1.65;max-width:470px;margin:0 auto">' +
    '당신은 믹스게임 테이블의 딜러다. 카드는 알아서 나간다.<br>' +
    '<b>손이 하는 일은 판단뿐이다</b> — 라운드를 열고(누가 먼저, 얼마), ' +
    '사고가 터지면 수습하고, 마지막에 팟을 지급한다.' +
    '</div>' +
    '<div class="cap" style="margin:18px 0 9px">연습 — 문제가 주어지지 않는다. 순서를 스스로 짠다</div>';

  /* 게임은 세 축의 조합이다. 구성이 손이 하는 일을 정하므로 구성으로 묶어 보여준다. */
  for (var f = 0; f < FAMILIES.length; f++) {
    var fam = FAMILIES[f];
    var picks = ROTATION.filter(function (id) { return SPECS[id].family === fam.id; });
    if (!picks.length) continue;
    h += '<div class="picklist">' +
      '<div class="famhd"><b>' + fam.ko + '</b><span>' + fam.note + '</span></div>';
    for (var i = 0; i < picks.length; i++) {
      var sp = SPECS[picks[i]];
      h += '<button class="ch" data-prac="' + sp.id + '">' + sp.ko +
        '<span class="sub">' + sp.gameKo + ' · ' + sp.bettingKo + '</span></button>';
    }
    h += '</div>';
  }
  h +=
    '<div style="max-width:390px;margin:20px auto 0;padding-top:14px;border-top:1px solid var(--line)">' +
    '<div class="cap" style="margin-bottom:8px">시험 — 사고가 터지고, 틀린 판단 세 번이면 끝이다</div>' +
    '<button class="btn ghostbtn" id="go">딜링 룸 — 핸드마다 종목이 바뀐다</button>' +
    (best ? '<div class="cap" style="margin-top:10px">최고 기록 <b style="font-family:var(--mono)">' + best + '핸드</b></div>' : '') +
    '</div>' +
    '<div class="hint" style="text-align:center">카드가 날아가는 중에 화면을 클릭하면 건너뜁니다</div>' +
    '</div>';
  return h;
}

function topHTML() {
  var h = '';
  for (var i = 0; i < 3; i++) h += '<span class="' + (i < G.lives ? 'on' : 'off') + '">♥</span>';
  return '<div class="top">' +
    '<span class="game">' + H.spec.ko + '</span>' +
    '<span class="fam">' + H.spec.familyKo + ' · ' + H.spec.bettingKo + '</span>' +
    '<span class="spacer"></span>' +
    '<span class="kv">핸드 <b>' + G.hands + '</b></span>' +
    '<span class="kv">사고 <b>' + G.incidents + '</b></span>' +
    '<span class="kv">최고 <b>' + best + '</b></span>' +
    '<span class="hearts">' + h + '</span>' +
    '</div>';
}

function boardHTML() {
  var s = STEP;
  var seatPick = PHASE === 'popen' || PHASE === 'pwin' || PHASE === 'ptarget' ||
                 (PHASE === 'ask' && s && (s.kind === 'seat' || s.kind === 'open')) ||
                 (PHASE === 'target' && s && s.target && s.target.kind === 'seat');
  var pilePick = (PHASE === 'target' && s && s.target && s.target.kind === 'pile');
  var order = [0, 1, 2, 5, 4, 3];
  var h = '<div class="board" id="board">';

  // 위쪽 3좌석
  for (var k = 0; k < 3; k++) h += seatHTML(H.seats[order[k]], seatPick);

  // 펠트
  h += '<div class="felt">' +
    pileHTML('stub', '스텁', Math.max(0, H.deck.length - H.di) + '장', pilePick) +
    pileHTML('burn', '번', H.burns + '장', pilePick) +
    pileHTML('discard', '디스카드', H.discards + '장', pilePick) +
    (H.spec.family === 'stud' ? pileHTML('center', '중앙', '—', pilePick) : '') +
    (H.spec.family === 'flop' ? commuHTML() : '') +
    '<div class="pot">' +
    '<div class="lb">팟</div><div class="n">' + won(H.pot) + '</div>' +
    (betsOut() ? '<div class="out">앞에 ' + won(betsOut()) + '</div>' : '') +
    '</div>' +
    '</div>';

  // 아래쪽 3좌석
  for (k = 3; k < 6; k++) h += seatHTML(H.seats[order[k]], seatPick);

  // 스트릿 진행바
  h += '<div class="streets">';
  for (k = 0; k < H.spec.streets.length; k++) {
    var cls = k === H.stageIdx ? 'now' : (k < H.stageIdx ? 'past' : '');
    h += '<span class="' + cls + '">' + H.spec.streets[k].short + '</span>';
  }
  h += '</div></div>';
  return h;
}

/* 커뮤니티 보드 — 다섯 자리를 미리 비워 둔다. 몇 장이 더 올지 눈에 보여야 한다. */
function commuHTML() {
  var h = '<div class="commu" data-board="1"><span class="lb">보드</span>';
  for (var i = 0; i < 5; i++) {
    h += H.board[i] ? cardHTML(H.board[i], 'big') : '<span class="slot"></span>';
  }
  return h + '</div>';
}

function seatHTML(s, pick) {
  var cls = 'seat' + (s.folded ? ' folded' : '') + (pick && !s.folded ? ' pickable' : '') +
            (H.flags.hotSeat === s.i ? ' flag' : '');
  var tag = '';
  if (H.spec.forced === 'blinds') {
    if (s.pos === 0) tag = 'D';
    else if (s.pos === 1) tag = 'SB';
    else if (s.pos === 2) tag = 'BB';
  }
  /* 노출 사고는 실제로 카드가 보여야 한다 — 빨간 테두리만으로는 사고가 안 보인다 */
  var revN = (H.flags.reveal && H.flags.reveal.seat === s.i) ? H.flags.reveal.n : 0;
  var open = H.showdown && !s.folded;
  var cards = '';
  var i;
  for (i = 0; i < s.down.length; i++) {
    if (open && s.down[i]) cards += cardHTML(s.down[i], 'big');
    else cards += (i < revN && s.down[i]) ? cardHTML(s.down[i], 'big hot') : backHTML();
  }
  for (i = 0; i < s.up.length; i++) cards += cardHTML(s.up[i], 'big');
  return '<div class="' + cls + '" data-seat="' + s.i + '">' +
    '<div class="nm">' + s.name + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</div>' +
    '<div class="cards">' + (cards || '<span class="st">—</span>') + '</div>' +
    '<div class="bet">' + chipsHTML(s.bet || 0) + '</div>' +
    (s.folded ? '<div class="st">폴드</div>' : '') +
    '</div>';
}

function pileHTML(id, label, n, pick) {
  return '<div class="pile' + (pick ? ' pickable' : '') + '" data-pile="' + id + '">' +
    backHTML() + '<span class="lb">' + label + '</span><span class="n">' + n + '</span></div>';
}

function panelHTML() {
  if (PHASE === 'anim') {
    return '<div class="panel"><div class="kicker">' + busyLabel() + '</div>' +
      '<div class="q">' + H.stage + '</div>' +
      '<div class="hint">화면을 클릭하면 건너뜁니다</div></div>';
  }
  if (PHASE === 'handend') {
    return '<div class="panel"><div class="kicker">핸드 종료</div>' +
      '<div class="q">' + G.hands + '번째 핸드를 끝냈습니다.</div>' +
      '<div class="qsub">다음 핸드는 <b>' + SPECS[ROTATION[G.hands % ROTATION.length]].ko + '</b>입니다.</div>' +
      '<button class="btn" id="nexthand">다음 핸드</button></div>';
  }
  var s = STEP;
  if (!s) return '<div class="panel"><div class="kicker">진행 중</div><div class="q">' + (H.stage || '준비') + '</div></div>';

  var h = '<div class="panel ' + (s.tone || '') + '">';
  h += '<div class="kicker">' + s.kicker + '</div>';
  h += '<div class="q">' + s.q + '</div>';
  if (s.sub) h += '<div class="qsub">' + s.sub + '</div>';

  if (s.kind === 'seat') {
    h += '<div class="hint">테이블에서 좌석을 클릭하세요.</div>';
  } else if (s.kind === 'open') {
    if (s.seatPicked < 0) {
      h += '<div class="hint">테이블에서 좌석을 클릭하세요.</div>';
    } else if (!s.bet) {
      /* 노리밋은 벳 크기를 묻지 않는다 — 좌석 지목에서 판단이 끝난다 */
      h += '<div class="picked">첫 액션 — ' + H.seats[s.seatPicked].name + ' 지목 완료</div>';
    } else {
      h += '<div class="picked">첫 액션 — ' + H.seats[s.seatPicked].name + ' 지목 완료</div>';
      h += '<div class="q" style="margin-top:8px">' + s.bet.q + '</div>' +
           (s.bet.sub ? '<div class="qsub">' + s.bet.sub + '</div>' : '');
      h += s.bet.input === 'amount'
        ? amtHTML(s.bet, PHASE === 'openbet', s.typed)
        : choiceHTML(s.bet.choices, PHASE === 'openbet', s.bet.correct, s.picked);
    }
  } else if (s.kind === 'amount') {
    h += amtHTML(s, PHASE === 'ask', s.typed);
  } else if (s.kind === 'incident') {
    h += choiceHTML(s.choices, PHASE === 'ask', s.correct, s.picked);
    if (PHASE === 'target') {
      h += '<div class="verdict ok"><div class="hd">절차는 맞습니다. 이제 어디에?</div>' +
        s.target.prompt + '</div>';
    }
  }

  if (VERDICT) {
    h += '<div class="verdict ' + (VERDICT.ok ? 'ok' : 'no') + '">' +
      '<div class="hd">' + (VERDICT.ok ? '정답' : '오답 · 생명 −1') + '</div>' +
      (VERDICT.extra ? VERDICT.extra + ' ' : '') + VERDICT.why +
      (VERDICT.cite ? '<div class="cite"><b>' + VERDICT.cite.src + '</b> — ' + VERDICT.cite.txt + '</div>' : '') +
      '</div>';
    h += G.over
      ? '<button class="btn" id="showend">근무 종료 — 결과 보기</button>'
      : '<button class="btn" id="cont">다음</button>';
  }
  h += '</div>';
  return h;
}

/* 선택지는 살아 있을 때만 누를 수 있고, 채점 뒤에는 정답·오답이 그대로 남는다. */
function choiceHTML(list, live, correct, picked) {
  var h = '<div class="choices">', i;
  for (i = 0; i < list.length; i++) {
    if (live) { h += '<button class="ch" data-ch="' + i + '">' + list[i] + '</button>'; continue; }
    var cls = 'ch' + (i === correct ? ' right' : (i === picked ? ' wrong' : ''));
    h += '<button class="' + cls + '" disabled>' + list[i] + '</button>';
  }
  return h + '</div>';
}

function amtHTML(q, live, typed) {
  if (live) {
    return '<div class="amt">' +
      '<input id="amtin" type="text" inputmode="numeric" placeholder="0" autocomplete="off">' +
      '<button class="go" id="amtgo">확인</button></div>' +
      '<div class="calc">팟벳 = <b>콜 금액</b> + <b>콜한 뒤 팟에 있는 금액</b></div>';
  }
  return '<div class="calc">낸 금액 <b>' + (typed == null ? '—' : won(typed)) +
    '</b> · 정답 <b>' + won(q.amount) + '</b></div>';
}

function logHTML() {
  var h = '<div class="log" id="log">';
  for (var i = 0; i < H.log.length; i++) {
    h += '<div class="row ' + H.log[i].c + '"><span class="n">' + (i + 1) + '</span><span>' + H.log[i].t + '</span></div>';
  }
  return h + '</div>';
}

function doneHTML() {
  var survived = G.hands - 1;
  return '<div class="panel done">' +
    '<div class="kicker">근무 종료</div>' +
    '<div class="big">' + survived + '</div>' +
    '<div class="cap">핸드를 버텼습니다</div>' +
    '<div style="max-width:340px;margin:18px auto 0;text-align:left">' +
    tl('처리한 사고', G.incidents + '건') +
    tl('맞은 판단', G.right + '개') +
    tl('틀린 판단', G.wrong + '개') +
    tl('최고 기록', best + '핸드') +
    '</div>' +
    '<button class="btn" id="again" style="max-width:300px;margin:18px auto 0">다시 딜링</button>' +
    '</div>';
}
function tl(a, b) { return '<div class="tline"><span>' + a + '</span><span class="s">' + b + '</span></div>'; }

// 이벤트 배선 ─────────────────────────────────────
function wire() {
  var go = $('#go'); if (go) go.onclick = function () { G.started = true; G.mode = 'room'; startHand(); };
  var pracs = document.querySelectorAll('[data-prac]');
  for (var pi = 0; pi < pracs.length; pi++) {
    (function (el) {
      el.onclick = function () { startPractice(el.getAttribute('data-prac')); };
    })(pracs[pi]);
  }
  var pa = $('#pagain'); if (pa) pa.onclick = function () { startPractice(P.specId); };
  var po = $('#pother'); if (po) po.onclick = function () {
    var k = ROTATION.indexOf(P.specId);
    startPractice(ROTATION[(k + 1) % ROTATION.length]);
  };
  var ph = $('#phome'); if (ph) ph.onclick = function () { G.started = false; G.mode = null; P = null; render(); };
  var acts = document.querySelectorAll('[data-act]');
  for (var ai = 0; ai < acts.length; ai++) {
    (function (el) { el.onclick = function () { onPalette(el.getAttribute('data-act')); }; })(acts[ai]);
  }
  var ag = $('#again'); if (ag) ag.onclick = function () {
    G = { lives: 3, hands: 0, incidents: 0, right: 0, wrong: 0, over: false, showEnd: false, started: true, mode: 'room' };
    startHand();
  };
  var se = $('#showend'); if (se) se.onclick = function () { G.showEnd = true; render(); };
  var nh = $('#nexthand'); if (nh) nh.onclick = function () { startHand(); };
  var ct = $('#cont'); if (ct) ct.onclick = nextAfterVerdict;

  var chs = document.querySelectorAll('[data-ch]');
  for (var i = 0; i < chs.length; i++) {
    (function (el) { el.onclick = function () { onChoice(parseInt(el.getAttribute('data-ch'), 10)); }; })(chs[i]);
  }
  var seats = document.querySelectorAll('[data-seat]');
  for (i = 0; i < seats.length; i++) {
    (function (el) { el.onclick = function () { onSeat(parseInt(el.getAttribute('data-seat'), 10)); }; })(seats[i]);
  }
  var piles = document.querySelectorAll('[data-pile]');
  for (i = 0; i < piles.length; i++) {
    (function (el) { el.onclick = function () { onPile(el.getAttribute('data-pile')); }; })(piles[i]);
  }
  var ain = $('#amtin');
  if (ain) {
    ain.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); submitAmount(); } };
    ain.focus();
  }
  var ago = $('#amtgo'); if (ago) ago.onclick = submitAmount;

  var lg = $('#log'); if (lg) lg.scrollTop = lg.scrollHeight;
}

// 어디를 클릭하든 애니메이션은 건너뛴다
document.addEventListener('click', function () { if (FLIGHT) skipFlight(); }, true);

render();
})();
</script>
</body>
