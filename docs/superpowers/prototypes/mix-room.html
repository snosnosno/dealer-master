<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딜링 룸 — 믹스게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap">
<style>
:root {
  --ground:      #EFF3F1;
  --surface:     #FFFFFF;
  --surface-2:   #E4ECE8;
  --ink:         #0E1F1A;
  --ink-2:       #4B5F58;
  --ink-3:       #7C8E87;
  --line:        #D2DED8;
  --line-strong: #B6C7C0;

  --felt:        #0F6E56;
  --felt-edge:   #085041;
  --felt-deep:   #04342C;
  --felt-ink:    #E1F5EE;

  --amber:       #EF9F27;
  --amber-ink:   #854F0B;
  --amber-bg:    #FAEEDA;

  --red:         #B23A2E;
  --red-ink:     #8E2C22;
  --red-bg:      #FBEBE8;

  --ok:          #0F6E56;
  --ok-bg:       #E1F5EE;

  --shadow: 0 1px 2px rgba(4,52,44,.06), 0 10px 28px rgba(4,52,44,.08);
  --sans: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system,
          BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0A1310;
    --surface:     #111E19;
    --surface-2:   #18291F;
    --ink:         #E6F0EC;
    --ink-2:       #9CB2AA;
    --ink-3:       #6E837C;
    --line:        #24372F;
    --line-strong: #354A41;
    --felt:        #0D6350;
    --felt-edge:   #073F33;
    --felt-deep:   #04241E;
    --amber-bg:    #35270F;
    --amber-ink:   #F0C078;
    --red-bg:      #2E1512;
    --red-ink:     #E8877A;
    --ok-bg:       #0E2B23;
    --ok:          #1D9E75;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.wrap { max-width: 1000px; margin: 0 auto; padding: 12px 12px 40px; }

/* 상단 ─────────────────────────────── */
.top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  margin-bottom: 10px;
}
.top .game { font-weight: 900; font-size: 16px; letter-spacing: -.01em; }
.top .fam {
  font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px;
  background: var(--felt); color: var(--felt-ink);
}
.top .spacer { flex: 1; }
.top .kv { font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--ink-3); }
.top .kv b { color: var(--ink); font-size: 14px; }
.hearts { font-size: 17px; letter-spacing: 1px; }
.hearts .on { color: var(--red); }
.hearts .off { color: var(--line-strong); }

/* 테이블 ───────────────────────────── */
.board {
  background: linear-gradient(180deg, var(--felt) 0%, var(--felt-edge) 100%);
  border: 3px solid var(--felt-deep); border-radius: 18px;
  padding: 12px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.seat {
  background: rgba(0,0,0,.20); border: 1.5px solid transparent;
  border-radius: 10px; padding: 7px 8px; min-height: 74px;
  color: var(--felt-ink); position: relative;
}
.seat.folded { opacity: .34; }
.seat.actor { border-color: var(--amber); background: rgba(239,159,39,.16); }
.seat.pickable { cursor: pointer; border-color: rgba(255,255,255,.55); }
.seat.pickable:hover { background: rgba(255,255,255,.16); border-color: #fff; }
.seat.flag { border-color: var(--red); box-shadow: 0 0 0 3px rgba(178,58,46,.35); }
.seat .nm { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; }
.seat .tag {
  font-family: var(--mono); font-size: 9px; font-weight: 800;
  padding: 1px 5px; border-radius: 99px; background: rgba(255,255,255,.20);
}
.seat .cards { display: flex; gap: 3px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.seat .st { margin-top: 5px; font-family: var(--mono); font-size: 10px; opacity: .72; }
/* 베팅 중인 칩 — 좌석 앞에 쌓였다가 팟으로 날아간다. 드래그는 없다(§9). */
.seat .bet { display: flex; align-items: center; gap: 5px; margin-top: 6px; min-height: 16px; }
.seat .bet .amt { font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: var(--amber); }
.chip {
  width: 14px; height: 14px; border-radius: 50%; flex: none;
  border: 1.5px dashed rgba(255,255,255,.62);
  box-shadow: 0 1px 2px rgba(0,0,0,.38); margin-left: -5px;
}
.chip + .chip { margin-left: -5px; }
.seat .bet .chip:first-child { margin-left: 0; }
.chip.c500   { background: #D9DEDB; }
.chip.c1000  { background: #2E6E52; }
.chip.c5000  { background: #B23A2E; }
.chip.c25000 { background: #2C4A7A; }

.pcard {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 30px; border-radius: 3.5px; flex: none;
  font-weight: 800; line-height: 1;
}
.pcard.back {
  background: repeating-linear-gradient(45deg, #1D4E6B 0 3px, #17405A 3px 6px);
  border: 1px solid rgba(255,255,255,.28);
}
.pcard.face { background: #FBFDFC; color: #101B17; flex-direction: column; gap: 0; border: 1px solid rgba(0,0,0,.22); }
.pcard.face.red { color: #B23A2E; }
.pcard.face .r { font-family: var(--mono); font-size: 11px; }
.pcard.face .s { font-size: 10px; }
.pcard.big { width: 30px; height: 41px; }
.pcard.big .r { font-size: 15px; }
.pcard.big .s { font-size: 13px; }
.pcard.hot { box-shadow: 0 0 0 2.5px var(--red); }

.felt {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; padding: 9px 6px;
  border-top: 1px solid rgba(255,255,255,.10); border-bottom: 1px solid rgba(255,255,255,.10);
}
.pile {
  display: flex; align-items: center; gap: 6px; color: var(--felt-ink);
  padding: 5px 8px; border-radius: 9px; border: 1.5px solid transparent;
}
.pile .lb { font-size: 10px; font-weight: 800; opacity: .8; }
.pile .n { font-family: var(--mono); font-size: 12px; font-weight: 800; }
.pile.pickable { cursor: pointer; border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.08); }
.pile.pickable:hover { background: rgba(255,255,255,.20); border-color: #fff; }
.pot {
  margin-left: auto; color: var(--felt-ink); text-align: right;
  padding: 5px 10px; border-radius: 9px; border: 1.5px solid transparent;
}
.pot .lb { font-size: 10px; font-weight: 800; opacity: .8; }
.pot .n { font-family: var(--mono); font-size: 19px; font-weight: 800; }
.pot .out { font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: var(--amber); }
.pot.drop { border-color: var(--amber); background: rgba(239,159,39,.20); }
.pot.drop.over { background: rgba(239,159,39,.42); }

.streets {
  display: flex; gap: 4px; flex-wrap: wrap; grid-column: 1 / -1;
  font-family: var(--mono); font-size: 10px; font-weight: 800;
  color: var(--felt-ink); padding-top: 2px;
}
.streets span { padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,.22); opacity: .5; }
.streets span.now { background: var(--amber); color: #33241A; opacity: 1; }
.streets span.past { opacity: .3; }

/* 패널 ─────────────────────────────── */
.panel {
  margin-top: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 13px 14px;
}
.panel.alert { border-color: var(--red); background: var(--red-bg); }
.panel.talk { border-color: var(--amber); background: var(--amber-bg); }
.kicker {
  font-size: 10.5px; font-weight: 900; letter-spacing: .06em;
  color: var(--ink-3); text-transform: uppercase; margin-bottom: 5px;
}
.panel.alert .kicker { color: var(--red-ink); }
.panel.talk .kicker { color: var(--amber-ink); }
.q { font-size: 16px; font-weight: 800; line-height: 1.45; letter-spacing: -.01em; }
.qsub { margin-top: 5px; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.choices { display: grid; gap: 7px; margin-top: 11px; }
.choices.palette { grid-template-columns: repeat(3, 1fr); }
.choices.palette .ch { text-align: center; font-size: 13px; padding: 12px 6px; }
@media (max-width: 560px) { .choices.palette { grid-template-columns: repeat(2, 1fr); } }
.ch {
  text-align: left; font-family: var(--sans); font-size: 13.5px; font-weight: 700;
  line-height: 1.45; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line-strong); border-radius: 10px;
  padding: 10px 12px; cursor: pointer;
}
.ch:hover { border-color: var(--felt); background: var(--ok-bg); }
.ch:disabled { cursor: default; opacity: .55; }
.ch.right { border-color: var(--ok); background: var(--ok-bg); opacity: 1; }
.ch.wrong { border-color: var(--red); background: var(--red-bg); opacity: 1; }

.verdict { margin-top: 11px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.55; }
.verdict.ok { background: var(--ok-bg); border: 1px solid var(--ok); }
.verdict.no { background: var(--red-bg); border: 1px solid var(--red); }
.verdict .hd { font-weight: 900; font-size: 13.5px; margin-bottom: 3px; }
.verdict.ok .hd { color: var(--ok); }
.verdict.no .hd { color: var(--red-ink); }
.verdict .cite {
  margin-top: 7px; font-size: 11.5px; color: var(--ink-2);
  padding-top: 7px; border-top: 1px dashed var(--line-strong);
}
.verdict .cite b { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }

.btn {
  margin-top: 11px; width: 100%; padding: 12px; border: none; border-radius: 10px;
  background: var(--felt); color: #fff; font-family: var(--sans);
  font-size: 15px; font-weight: 900; cursor: pointer;
}
.btn:hover { background: var(--felt-edge); }
.btn.ghostbtn { background: transparent; color: var(--ink-2); border: 1.5px solid var(--line-strong); }

.hint { margin-top: 9px; font-size: 12px; color: var(--ink-3); font-weight: 700; }

/* 로그 ─────────────────────────────── */
.log {
  margin-top: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 12px; max-height: 152px; overflow-y: auto;
}
.log .row { display: flex; gap: 8px; padding: 3px 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.log .row .n { font-family: var(--mono); font-size: 10px; opacity: .5; flex: none; width: 18px; text-align: right; }
.log .row b { color: var(--ink); }
.log .row.hi { color: var(--amber-ink); font-weight: 700; }
.log .row.bad { color: var(--red-ink); font-weight: 700; }

/* 결과 ─────────────────────────────── */
.done { text-align: center; padding: 26px 16px; }
.done .big { font-family: var(--mono); font-size: 52px; font-weight: 800; letter-spacing: -.03em; }
.done .cap { font-size: 13px; color: var(--ink-3); font-weight: 800; }
.tline { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.tline .s { font-family: var(--mono); font-weight: 800; }

/* 종목 고르기 ─────────────────────── */
.picklist { display: grid; gap: 6px; max-width: 400px; margin: 0 auto 14px; }
.picklist .ch { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.picklist .ch .sub { font-family: var(--mono); font-size: 10.5px; font-weight: 800; color: var(--ink-3); }
.famhd {
  display: flex; align-items: baseline; gap: 8px; text-align: left;
  margin: 2px 0 1px; padding-top: 4px;
}
.famhd b { font-size: 12.5px; font-weight: 900; color: var(--ink); }
.famhd span { font-size: 11px; color: var(--ink-3); font-weight: 700; }

/* 커뮤니티 보드 ─────────────────────── */
.commu {
  display: flex; align-items: center; gap: 5px; color: var(--felt-ink);
  padding: 5px 9px; border-radius: 9px; background: rgba(0,0,0,.20);
}
.commu .lb { font-size: 10px; font-weight: 800; opacity: .8; margin-right: 2px; }
.commu .slot {
  width: 30px; height: 41px; border-radius: 3.5px; flex: none;
  border: 1px dashed rgba(255,255,255,.26);
}

/* 금액 입력 ─────────────────────────── */
.amt { display: flex; gap: 7px; margin-top: 11px; }
.amt input {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 19px; font-weight: 800;
  text-align: right; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 10px 12px;
}
.amt input:focus { outline: none; border-color: var(--felt); }
.amt .go {
  flex: none; padding: 0 18px; border: none; border-radius: 10px;
  background: var(--felt); color: #fff; font-family: var(--sans);
  font-size: 14px; font-weight: 900; cursor: pointer;
}
.amt .go:hover { background: var(--felt-edge); }
.calc { margin-top: 9px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); line-height: 1.7; }
.calc b { color: var(--ink); font-weight: 800; }
.picked {
  margin-top: 10px; font-size: 12.5px; font-weight: 800; color: var(--ok);
  padding-top: 9px; border-top: 1px dashed var(--line-strong);
}

/* 비행 카드 ─────────────────────────── */
#fly { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.flier { position: fixed; transition: transform .15s cubic-bezier(.3,.7,.4,1); will-change: transform; }

@media (max-width: 620px) {
  .board { grid-template-columns: repeat(2, 1fr); }
  .pcard { width: 19px; height: 26px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="fly"></div>

<script>
(function () {
'use strict';

/* ═══════════════════════════════════════════════════════
   딜링 룸 — 축 3 프로토타입 3번째 판본
   방식 A (docs/superpowers/plans/2026-09-02-axis3-simulation-options.md)

   설계의 핵심 하나: 사고는 목록이 아니라 조합이다.
   같은 "카드 노출"이라도 종목과 시점이 다르면 수습 절차가 다르다.
   그 근거는 전부 mixgame-facts.md §3 (프로토콜 원문)에서 온다.
   ═══════════════════════════════════════════════════════ */

// 유틸 ────────────────────────────────────────────
function rnd(n) { return Math.floor(Math.random() * n); }
function pick(a) { return a[rnd(a.length)]; }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function won(n) { return n.toLocaleString('ko-KR'); }

/* 조사는 앞 글자의 받침으로 갈린다. 족보 이름이 한글("풀하우스")로도 숫자("7-5-4")로도
   영문자("...-2-A")로도 끝나서 세 경우를 다 봐야 한다. 읽는 소리 기준이다 —
   1은 "일"이라 받침이 있고, A 는 "에이"라 없다. */
function josa(word, withB, withoutB) {
  var t = String(word).replace(/<[^>]*>/g, '').replace(/\s+$/, '');
  if (!t.length) return withoutB;
  var ch = t.charAt(t.length - 1), c = ch.charCodeAt(0), has;
  if (c >= 0xAC00 && c <= 0xD7A3) has = (c - 0xAC00) % 28 !== 0;
  else if (ch >= '0' && ch <= '9') has = '0136780'.indexOf(ch) >= 0;
  else has = 'LMNRlmnr'.indexOf(ch) >= 0;
  return has ? withB : withoutB;
}
function eunGa(w) { return josa(w, '이', '가'); }
function eulReul(w) { return josa(w, '을', '를'); }
function $(s) { return document.querySelector(s); }

// 게임 스펙 ───────────────────────────────────────
/* mix-rush · mix-deal 과 같은 모양이다. 버리지 않는다 (ADR-003). */
var SPECS = {
  /* 7-Card Stud — 하이 × 스터드 × 픽스리밋 (가이드 p7~8) */
  stud7: {
    id: 'stud7', ko: '7카드 스터드', en: '7-Card Stud',
    game: 'high',  gameKo: '하이',
    family: 'stud', familyKo: '스터드',
    betting: 'FL', bettingKo: '픽스 리밋', raiseCap: 5,
    holeCardCount: 7, forced: 'ante+bringin',
    eval: { hi: 'standard', lo: null, qualifier: null },
    streets: [
      { id: '3rd', ko: '3번째 카드', short: '3번째', deal: { down: 2, up: 1 }, burn: false, firstToAct: 'lowest-upcard', size: 1 },
      { id: '4th', ko: '4번째 카드', short: '4번째', deal: { down: 0, up: 1 }, burn: true, firstToAct: 'highest-upcard', size: 1 },
      { id: '5th', ko: '5번째 카드', short: '5번째', deal: { down: 0, up: 1 }, burn: true, firstToAct: 'highest-upcard', size: 2 },
      { id: '6th', ko: '6번째 카드', short: '6번째', deal: { down: 0, up: 1 }, burn: true, firstToAct: 'highest-upcard', size: 2 },
      { id: '7th', ko: '7번째 카드', short: '7번째', deal: { down: 1, up: 0 }, burn: true, firstToAct: 'highest-upcard', size: 2 }
    ]
  },

  /* 7-Card Stud Hi/Lo 8 — 하이로우 8 × 스터드 × 픽스리밋.
     프로토콜이 Hi-Low Regular 를 Stud/8 의 예외로 정의하므로 그 예외를 뒤집으면 이것이 나온다. */
  stud8: {
    id: 'stud8', ko: '스터드 하이로우 8', en: '7-Card Stud Hi/Lo 8',
    game: 'hilo8', gameKo: '하이로우 8',
    family: 'stud', familyKo: '스터드',
    betting: 'FL', bettingKo: '픽스 리밋', raiseCap: 5,
    holeCardCount: 7, forced: 'ante+bringin',
    eval: { hi: 'standard', lo: 'a5', qualifier: 8 },
    streets: [
      { id: '3rd', ko: '3번째 카드', short: '3번째', deal: { down: 2, up: 1 }, burn: false, firstToAct: 'lowest-upcard', size: 1 },
      { id: '4th', ko: '4번째 카드', short: '4번째', deal: { down: 0, up: 1 }, burn: true, firstToAct: 'highest-upcard', size: 1 },
      { id: '5th', ko: '5번째 카드', short: '5번째', deal: { down: 0, up: 1 }, burn: true, firstToAct: 'highest-upcard', size: 2 },
      { id: '6th', ko: '6번째 카드', short: '6번째', deal: { down: 0, up: 1 }, burn: true, firstToAct: 'highest-upcard', size: 2 },
      { id: '7th', ko: '7번째 카드', short: '7번째', deal: { down: 1, up: 0 }, burn: true, firstToAct: 'highest-upcard', size: 2 }
    ]
  },

  /* Stud Hi/Lo Regular — 같은 하이로우인데 자격이 없다. 그래서 첫 액션 방향까지 뒤집힌다:
     첫 라운드는 가장 높은 카드, 이후에는 가장 낮은 핸드다 (프로토콜 Hi-Low Regular 조항). */
  studreg: {
    id: 'studreg', ko: '스터드 하이로우 레귤러', en: 'Stud Hi/Lo Regular',
    game: 'hilo', gameKo: '하이로우 (자격 없음)',
    family: 'stud', familyKo: '스터드',
    betting: 'FL', bettingKo: '픽스 리밋', raiseCap: 5,
    holeCardCount: 7, forced: 'ante+bringin',
    eval: { hi: 'standard', lo: 'a5', qualifier: null },
    streets: [
      { id: '3rd', ko: '3번째 카드', short: '3번째', deal: { down: 2, up: 1 }, burn: false, firstToAct: 'highest-upcard-rank', size: 1 },

/* 핸드마다 종목이 바뀐다. 구성이 바뀌면 손이 하는 일이 통째로 달라지는 것이 이 축의 훈련이다.
   스터드 → 드로우 → 플랍 순으로 묶어 뒀다. */
var ROTATION = ['stud7', 'stud8', 'studreg', 'razz', 'td27', 'sd27', 'badugi', 'nlh', 'plo', 'plo8'];

/* 게임 구성 — 손이 하는 일을 정하는 축이다. 카드가 어떻게 나가느냐가 여기서 갈린다. */
var FAMILIES = [
  { id: 'stud', ko: '스터드', note: '앤티 + 브링인 · 업카드가 보인다' },
  { id: 'draw', ko: '드로우', note: '블라인드 · 카드를 바꾼다' },
  { id: 'flop', ko: '플랍',  note: '블라인드 · 보드가 공용이다' }
];

var GUIDE = 'Mix Game Guide v1';
var PROTO = 'Mixed Games Rules & Protocols (2026-01)';

var ANTE = 500, BRINGIN = 1000, SMALL = 2000, BIG = 4000, SB = 1000, BB = 2000;
var SEAT_N = 6;
var BEST_KEY = 'mixroom.best';

// 카드 ────────────────────────────────────────────
var RANKS = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
var SUITS = [{ s: '♠', red: false }, { s: '♥', red: true }, { s: '♦', red: true }, { s: '♣', red: false }];
function rv(c) { return RANKS.indexOf(c.r); }
function newDeck() {
  var d = [], i, k;
  for (i = 0; i < RANKS.length; i++) for (k = 0; k < SUITS.length; k++) d.push({ r: RANKS[i], su: SUITS[k] });
  return shuffle(d);
}
function cardHTML(c, cls) {
  if (!c) return '';
  return '<span class="pcard face' + (c.su.red ? ' red' : '') + (cls ? ' ' + cls : '') + '">' +
    '<b class="r">' + c.r + '</b><b class="s">' + c.su.s + '</b></span>';
}
function backHTML(cls) { return '<span class="pcard back' + (cls ? ' ' + cls : '') + '"></span>'; }

/* 칩 ─ 금액을 실제 칩 더미로 쪼갠다. 딜러가 눈으로 세는 단위 그대로다. */
var CHIPS = [25000, 5000, 1000, 500];
function chipBreak(amt) {
  var out = [], i, k, c;
  for (i = 0; i < CHIPS.length; i++) {
    c = Math.floor(amt / CHIPS[i]);
    amt -= c * CHIPS[i];
    for (k = 0; k < c && out.length < 14; k++) out.push(CHIPS[i]);
  }
  return out;
}
function chipsHTML(amt) {
  if (!amt) return '';
  var cs = chipBreak(amt), h = '', i;
  for (i = 0; i < cs.length; i++) h += '<span class="chip c' + cs[i] + '"></span>';
  return h + '<span class="amt">' + won(amt) + '</span>';
}

// 전역 상태 ───────────────────────────────────────
var G = { lives: 3, hands: 0, incidents: 0, right: 0, wrong: 0, over: false, showEnd: false, started: false, mode: null };
var H = null;
var STEP = null;      // 현재 멈춰 있는 판단
var PHASE = 'idle';   // idle | anim | ask | target | verdict
var VERDICT = null;
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

// ═══════════════════════════════════════════════════
// 핸드 만들기
// ═══════════════════════════════════════════════════
function startHand() {
  var spec = SPECS[ROTATION[G.hands % ROTATION.length]];
  var deck = newDeck();
  var seats = [], i;
  var btn = rnd(SEAT_N);
  for (i = 0; i < SEAT_N; i++) {
    seats.push({
      i: i, name: (i + 1) + '번', pos: (i - btn + SEAT_N) % SEAT_N,
      down: [], up: [], folded: false, declared: 0, given: 0, bet: 0
    });
  }
  H = {
    spec: spec, seats: seats, deck: deck, di: 0, btn: btn,
    pot: 0, burns: 0, discards: 0, board: [],
    stage: '', stageIdx: -1, log: [], flags: {}, incidents: [],
    q: [], qi: 0
  };
  buildQueue();
  G.hands++;
  PHASE = 'idle';
  render();
  advance();
}

function draw1() {
  /* 스텁이 바닥나면 리셔플한다 — 드로우게임은 6인 3라운드면 52장을 넘길 수 있다 */
  if (H.di >= H.deck.length) { H.deck = newDeck(); H.di = 0; log('스텁이 떨어져 리셔플했다'); }
  return H.deck[H.di++];
}
function actives() { return H.seats.filter(function (s) { return !s.folded; }); }

/* 좌석 앞에 놓여 아직 수거되지 않은 칩. 라운드가 끝나야 팟으로 들어간다. */
function betsOut() {
  var t = 0, i;
  for (i = 0; i < H.seats.length; i++) t += H.seats[i].bet || 0;
  return t;
}
/* 규칙이 말하는 「팟」은 가운데 쌓인 것 + 앞에 놓인 것이다.
   딜러가 팟리밋을 계산할 때 둘을 다 세야 하는 것이 이 게임의 교육 지점이다. */
function potNow_() { return H.pot + betsOut(); }

function log(txt, cls) {
  H.log.push({ t: txt, c: cls || '' });
  if (H.log.length > 60) H.log.shift();
}

/* 스텝 큐 ─────────────────────────────────────────
   auto 스텝은 스스로 다음으로 넘어가고, ask 스텝은 멈춘다. */
function buildQueue() {
  var spec = H.spec, q = [];

  // 강제 베팅
  q.push({ t: 'forced' });

  /* 어느 스트릿에서 무엇을 물을지 미리 뽑는다 (매번 다르게).
     「누가 먼저」와 「얼마」는 한 라운드를 여는 동작 하나라 한 판단으로 묶여 있다. */
  var askOpenAt = {}, askPotAt = {};
  var pool = [], k;
  for (k = 1; k < spec.streets.length; k++) pool.push(k);
  shuffle(pool);
  askOpenAt[0] = true;                       // 첫 라운드는 항상 묻는다
  if (pool.length) askOpenAt[pool[0]] = true;
  if (pool.length > 2 && Math.random() < .55) askOpenAt[pool[1]] = true;
  /* 팟리밋 계산은 라운드가 열린 뒤 레이즈 시점에만 성립한다 — 플랍게임에서만 낸다. */
  if (spec.betting === 'PL' && pool.length) {
    shuffle(pool);
    askPotAt[pool[0]] = true;
  }

  // 사고 배치 — 0~2건
  var r = Math.random();
  var incN = r < .33 ? 0 : (r < .85 ? 1 : 2);
  var incSlots = shuffle(spec.streets.map(function (_, ix) { return ix; })).slice(0, incN);

  // 항의는 한 핸드에 많아야 한 번이다
  var obAt = Math.random() < .55 ? rnd(spec.streets.length) : -1;

  for (k = 0; k < spec.streets.length; k++) {
    var st = spec.streets[k];
    q.push({ t: 'stage', ix: k });
    if (st.burn) q.push({ t: 'burn' });
    if (st.draw) q.push({ t: 'drawround', ix: k });
    else q.push({ t: 'deal', ix: k });

    if (incSlots.indexOf(k) >= 0) q.push({ t: 'incident', ix: k });
    if (askOpenAt[k]) q.push({ t: 'askopen', ix: k });
    if (k === obAt) q.push({ t: 'objection', ix: k });
    if (askPotAt[k]) q.push({ t: 'askpot', ix: k });
    q.push({ t: 'bets', ix: k });
  }
  q.push({ t: 'showdown' });
  q.push({ t: 'askwinner' });
  q.push({ t: 'asklow' });
  q.push({ t: 'endhand' });
  H.q = q;
  H.qi = 0;
}

// ═══════════════════════════════════════════════════
// 진행 엔진
// ═══════════════════════════════════════════════════
function advance() {
  if (G.over) return;
  if (H.qi >= H.q.length) { startHand(); return; }
  var s = H.q[H.qi++];

  if (s.t === 'forced') return doForced(advance);
  if (s.t === 'stage') {
    H.stageIdx = s.ix; H.stage = H.spec.streets[s.ix].ko;
    log('— ' + H.stage + ' —', 'hi'); render(); return advance();
  }
  if (s.t === 'burn') {
    return flyTo('burn', 1, function () {
      H.burns++; log('번카드 <b>1장</b> (누적 ' + H.burns + '장)'); render(); advance();
    });
  }
  if (s.t === 'deal') return doDeal(s.ix);
  if (s.t === 'drawround') return doDrawRound(s.ix);
  if (s.t === 'bets') return doBets(s.ix);
  if (s.t === 'endhand') return doEndHand();
  if (s.t === 'showdown') {
    H.showdown = true;
    log('쇼다운 — 카드를 공개한다', 'hi');
    render(); return advance();
  }
  if (s.t === 'askwinner') { var w = mkAskWinner(); return w ? stop(w) : advance(); }
  if (s.t === 'asklow') { var lw = mkAskLow(); return lw ? stop(lw) : advance(); }

  if (s.t === 'askopen') { var a = mkAskOpen(s.ix); return a ? stop(a) : advance(); }
  if (s.t === 'askpot') { var pr = mkPotRaise(s.ix); return pr ? stop(pr) : advance(); }
  if (s.t === 'incident') { var inc = mkIncident(s.ix); return inc ? stop(inc) : advance(); }
  if (s.t === 'objection') { var ob = mkObjection(s.ix); return ob ? stop(ob) : advance(); }
  return advance();
}

function stop(step) {
  STEP = step; PHASE = 'ask'; VERDICT = null; render();
}

// 카드 배분 ───────────────────────────────────────
function doDeal(ix, next) {
  var st = H.spec.streets[ix], plan = [], list = actives();
  var i, k;

  /* 플랍게임의 보드는 좌석이 아니라 펠트 중앙으로 간다. 전원 공용이라 한 장씩만 나간다. */
  if (st.board) {
    for (k = 0; k < st.board; k++) plan.push({ board: true });
    flyDeal(plan, function () {
      log(H.stage + ' — 보드에 ' + st.board + '장');
      render(); (next || advance)();
    });
    return;
  }

  for (k = 0; k < st.deal.down; k++) for (i = 0; i < list.length; i++) plan.push({ seat: list[i].i, up: false });
  for (k = 0; k < st.deal.up; k++) for (i = 0; i < list.length; i++) plan.push({ seat: list[i].i, up: true });

  flyDeal(plan, function () {
    if (H.spec.family === 'stud' && st.deal.up > 0) fixTies(ix);
    log(H.stage + ' 딜 완료 — ' +
      (st.deal.down ? '다운 ' + st.deal.down + '장' : '') +
      (st.deal.down && st.deal.up ? ' · ' : '') +
      (st.deal.up ? '업 ' + st.deal.up + '장' : ''));
    render(); (next || advance)();
  });
}

/* 첫 액션 좌석을 물으려면 최고/최저 업카드가 하나여야 한다.
   자료에 동률 처리(무늬 순서)가 7카드 스터드 기준으로는 없으므로
   동률 자체를 만들지 않는다 — 짐작으로 채우지 않기 위해서다. */
function fixTies(ix) {
  var st = H.spec.streets[ix];
  for (var guard = 0; guard < 40; guard++) {
    var list = actives();
    if (actorSeat(list, st.firstToAct) !== null) return true;
    /* 동률인 좌석 하나의 방금 나간 업카드만 바꾼다. 아직 아무도 보지 않은 시점이다. */
    var victim = list[rnd(list.length)];
    if (!victim.up.length) return false;
    victim.up[victim.up.length - 1] = draw1();
  }
  return false;
}
/* 업카드로 만든 최고 핸드. 4장 이하라 스트레이트·플러시는 성립하지 않는다.
   그래서 포카드 > 트리플 > 투페어 > 원페어 > 하이카드 다섯 단계뿐이다. */
function upRank(s) {
  var counts = {}, i, v, k;
  for (i = 0; i < s.up.length; i++) { v = rv(s.up[i]); counts[v] = (counts[v] || 0) + 1; }
  var groups = [];
  for (k in counts) if (counts.hasOwnProperty(k)) groups.push({ v: parseInt(k, 10), n: counts[k] });
  groups.sort(function (a, b) { return b.n - a.n || b.v - a.v; });
  if (!groups.length) return { key: [-1], cat: -1, top: -1 };
  var cat;
  if (groups[0].n >= 4) cat = 7;
  else if (groups[0].n === 3) cat = 6;
  else if (groups[0].n === 2 && groups[1] && groups[1].n === 2) cat = 5;
  else if (groups[0].n === 2) cat = 4;
  else cat = 0;
  var key = [cat];
  for (i = 0; i < groups.length; i++) key.push(groups[i].v);
  return { key: key, cat: cat, top: groups[0].v };
}
function cmpKey(a, b) {
  var n = Math.max(a.length, b.length);
  for (var i = 0; i < n; i++) {
    var x = i < a.length ? a[i] : -1, y = i < b.length ? b[i] : -1;
    if (x !== y) return x - y;
  }
  return 0;
}
function handName(s) {
  var r = upRank(s), t = RANKS[r.top];
  if (r.cat === 7) return t + ' 포카드';
  if (r.cat === 6) return t + ' 트리플';
  if (r.cat === 5) return t + ' 투페어';
  if (r.cat === 4) return t + ' 페어';
  return t + ' 하이';
}
/* 최고 업카드 핸드가 하나뿐일 때만 그 좌석을 돌려준다. 동률이면 묻지 않는다 —
   무늬 우열은 7카드 스터드 기준으로 자료에 없다. */
function bestUpSeat(list) {
  var top = null, tied = false;
  for (var i = 0; i < list.length; i++) {
    if (top === null) { top = list[i]; continue; }
    var c = cmpKey(upRank(list[i]).key, upRank(top).key);
    if (c > 0) { top = list[i]; tied = false; }
    else if (c === 0) tied = true;
  }
  return tied ? null : top;
}
function lowUpSeat(list) {
  var lo = null, tied = false;
  for (var i = 0; i < list.length; i++) {
    if (lo === null) { lo = list[i]; continue; }
    var a = upKey(list[i], false), b = upKey(lo, false);
    if (a < b) { lo = list[i]; tied = false; }
    else if (a === b) tied = true;
  }
  return tied ? null : lo;
}
function openPair(list) {
  for (var i = 0; i < list.length; i++) if (upRank(list[i]).cat >= 4) return true;
  return false;
}
function upKey(s, wantMax) {
  var m = wantMax ? -1 : 99;
  for (var i = 0; i < s.up.length; i++) {
    var v = rv(s.up[i]);
    if (wantMax ? v > m : v < m) m = v;
  }
  return m;
}

// 드로우 라운드 ───────────────────────────────────
function doDrawRound(ix, next) {
  var list = actives(), plan = [], i;
  for (i = 0; i < list.length; i++) {
    var n = rnd(4);                      // 0~3장 교체
    list[i].declared = n;
    list[i].given = n;
    for (var k = 0; k < n; k++) plan.push({ seat: list[i].i, up: false, replace: true });
  }
  H.drawPlan = plan;
  var txt = list.map(function (s) {
    return s.name + ' ' + (s.declared === 0 ? '팻' : s.declared + '장');
  }).join(' · ');
  log('교체 장수 — ' + txt);
  H.discards += plan.length;
  flyDeal(plan, function () { log(H.stage + ' 교체 완료'); render(); (next || advance)(); });
}

// 베팅 빨리 감기 ──────────────────────────────────
function doBets(ix, next) {
  var st = H.spec.streets[ix];
  var potLimit = H.spec.betting === 'PL';
  var fin = function () { render(); (next || advance)(); };

  /* 팟리밋에서 매 라운드 전원이 콜하면 팟이 지수적으로 부푼다 —
     실제로는 체크로 넘어가는 라운드가 흔하다. 프리플랍만 반드시 액션이 돈다. */
  if (H.spec.betting !== 'FL' && ix > 0 && Math.random() < .45) {
    log('베팅 — 전원 체크');
    return fin();
  }

  /* 스터드 3번째 카드는 스몰벳으로 열지 않는다 — 브링인이고, 누군가 컴플리트해야
     그때 스몰벳이 된다. 물은 답과 눈에 보이는 진행이 같아야 한다. */
  if (H.spec.family === 'stud' && ix === 0) return doBringIn(fin);

  /* 팟리밋은 정해진 벳 단위가 없다 — 팟에서 나온 금액으로 돈다. */
  var amt = potLimit
    ? Math.max(BB, Math.round(potNow_() * 0.4 / CHIPUNIT) * CHIPUNIT)
    : H.spec.betting === 'NL'
      ? BB * (2 + rnd(3))
      : (st.size === 2 ? BIG : SMALL);
  /* 이미 앞에 나와 있는 벳(블라인드·팟리밋 계산 문제의 벳)보다 작게 받을 수는 없다 */
  var maxOut = 0, mi;
  for (mi = 0; mi < H.seats.length; mi++) maxOut = Math.max(maxOut, H.seats[mi].bet || 0);
  amt = Math.max(amt, maxOut);

  var list = actives(), parts = [], callers = 0, i;
  for (i = 0; i < list.length; i++) {
    var s = list[i];
    if (actives().length > 2 && Math.random() < .22) { s.folded = true; parts.push(s.name + ' 폴드'); }
    else {
      callers++;
      /* 블라인드처럼 이미 앞에 낸 칩이 있으면 차액만 채운다 — 두 번 내지 않는다. */
      s.bet = Math.max(s.bet, amt);
      parts.push(s.name + ' ' + (callers === 1 ? '벳' : '콜'));
    }
  }
  log('베팅 — ' + parts.join(' · ') + ' <b>(' + won(amt) + ')</b>');
  render();
  sweepChips(fin);
}

/* 스터드 3번째 카드의 첫 베팅 — 브링인으로 연다.
   브링인 좌석은 브링인 금액만 내고, 뒤에서 누군가 스몰벳까지 컴플리트하면
   그제서야 레벨이 스몰벳이 되고 브링인 좌석이 차액을 채운다.
   칩이 좌석마다 다른 높이로 쌓이는 것이 그 말을 대신한다. */
function doBringIn(fin) {
  var list = actives(), parts = [], i, s;
  var bring = actorSeat(list, H.spec.streets[0].firstToAct) || list[0];
  var wantComplete = Math.random() < .5;
  var completer = null;

  bring.bet = BRINGIN;
  parts.push(bring.name + ' 브링인 <b>' + won(BRINGIN) + '</b>');

  var rest = list.filter(function (x) { return x.i !== bring.i; });
  for (i = 0; i < rest.length; i++) {
    s = rest[i];
    if (actives().length > 2 && Math.random() < .22) { s.folded = true; parts.push(s.name + ' 폴드'); continue; }
    if (wantComplete && !completer) {
      completer = s; s.bet = SMALL;
      parts.push(s.name + ' 컴플리트 <b>' + won(SMALL) + '</b>');
      continue;
    }
    s.bet = completer ? SMALL : BRINGIN;
    parts.push(s.name + ' 콜 ' + won(s.bet));
  }
  if (completer) {
    bring.bet = SMALL;
    parts.push(bring.name + ' 차액 ' + won(SMALL - BRINGIN) + ' 채움');
  }
  log('3번째 카드 베팅 — ' + parts.join(' · '));
  render();
  sweepChips(fin);
}

/* 강제 베팅도 칩으로 나간다 — 좌석 앞에 놓였다가 팟으로 간다.
   팟이 숫자로만 커지면 그 돈이 어디서 왔는지 화면에 남지 않는다. */
function doForced(done) {
  var i, s;
  if (H.spec.forced === 'ante+bringin') {
    /* 앤티는 베팅이 아니다 — 카드가 나가기 전에 딜러가 걷어 팟에 넣는다. */
    for (i = 0; i < H.seats.length; i++) H.seats[i].bet = ANTE;
    log('앤티 <b>' + won(ANTE) + '</b> ×' + SEAT_N + ' 수거');
    render();
    return flyChips(done);
  }
  /* 블라인드는 첫 베팅 라운드의 벳이다. 라운드가 끝날 때까지 좌석 앞에 남는다. */
  s = seatByPos(1); if (s) s.bet = SB;
  s = seatByPos(2); if (s) s.bet = BB;
  log('SB <b>' + won(SB) + '</b> · BB <b>' + won(BB) + '</b> — 앞에 놓인다');
  render();
  done();
}

function doEndHand() {
  var n = actives().length;
  log('쇼다운 ' + n + '명 — ' + payoutLine(), 'hi');
  PHASE = 'handend';
  render();
}

// ═══════════════════════════════════════════════════
// 판단 1 — 첫 액션 좌석 지목
// ═══════════════════════════════════════════════════
function mkAskSeat(ix) {
  var st = H.spec.streets[ix], list = actives(), ans = null, why = '', cite = null;

  if (st.firstToAct === 'lowest-upcard') {
    var lo = actorSeat(list, 'lowest-upcard');
    if (!lo) return null;
    ans = lo.i;
    why = '가장 낮은 업카드가 브링인이다. 지금은 ' + lo.name + '의 ' +
      lo.up[0].r + lo.up[0].su.s + ' 가 가장 낮다.';
    cite = { src: GUIDE, txt: '3번째 카드의 첫 액션은 가장 낮은 업카드. 브링인 금액을 내거나 컴플리트한다.' };
  } else if (st.firstToAct === 'highest-upcard-a5') {
    var rhi = actorSeat(list, 'highest-upcard-a5');
    if (!rhi) return null;
    ans = rhi.i;
    why = '<b>라즈는 스터드와 반대다.</b> 가장 <b>높은</b> 업카드가 브링인이고, A 는 로우에서 최저 카드라 ' +
      '가장 높은 카드가 아니라 <b>가장 낮은</b> 카드다. 지금은 ' + rhi.name + '의 ' +
      rhi.up[0].r + rhi.up[0].su.s + ' 가 가장 높다.';
    cite = { src: '사용자 확인 (2026-09-03)', txt: '라즈 3번째 카드의 브링인은 가장 높은 업카드. 자료에 근거가 없어 확정받았다.' };
  } else if (st.firstToAct === 'highest-upcard-rank') {
    var rr = actorSeat(list, 'highest-upcard-rank');
    if (!rr) return null;
    ans = rr.i;
    why = '<b>레귤러는 자격 없는 하이로우</b>라 첫 라운드가 스터드와 반대다 — 가장 <b>높은</b> 카드가 액션을 연다. ' +
      '지금은 ' + rr.name + '의 ' + rr.up[0].r + rr.up[0].su.s + ' 가 가장 높다. ' +
      '동률이면 무늬로 가르고 <b>스페이드 K 가 최고</b>지만, 이 화면은 동률 상황을 출제하지 않는다.';
    cite = { src: PROTO, txt: 'Hi-Low Regular — 첫 라운드는 무늬 포함 최고 카드가 액션을 시작하며 스페이드 K 가 최고다.' };
  } else if (st.firstToAct === 'lowest-hand') {
    var rlo = actorSeat(list, 'lowest-hand');
    if (!rlo) return null;
    ans = rlo.i;
    var rest = list.filter(function (x) { return x.i !== rlo.i; });
    var rrun = actorSeat(rest, 'lowest-hand') || rest[0];
    why = (H.spec.id === 'razz' ? '라즈는' : '레귤러는') +
      ' 4번째 카드부터 <b>보드 로우가 가장 좋은</b>(가장 낮은) 좌석이 먼저 액션한다. ' +
      '지금은 ' + rlo.name + '의 <b>' + lowKo(evalLowA5(rlo.up)) + '</b>' + eunGa(lowKo(evalLowA5(rlo.up))) +
      (rrun ? ' ' + rrun.name + '의 ' + lowKo(evalLowA5(rrun.up)) + ' 보다 낮다.' : ' 가장 낮다.');
    cite = H.spec.id === 'razz'
      ? { src: '사용자 확인 (2026-09-03)', txt: '라즈는 4번째 카드부터 보드 로우가 가장 좋은 좌석이 먼저 액션한다.' }
      : { src: PROTO, txt: 'Hi-Low Regular — 이후 베팅 라운드는 가장 낮은 핸드가 액션을 시작한다.' };
  } else if (st.firstToAct === 'highest-upcard') {
    var hi = actorSeat(list, 'highest-upcard');
    if (!hi) return null;
    ans = hi.i;
    var second = list.filter(function (x) { return x.i !== hi.i; });
    var runner = actorSeat(second, 'highest-upcard') || second[0];
    why = '4번째 카드부터는 <b>업카드로 만든 핸드가 가장 높은</b> 좌석이 먼저 액션한다. ' +
      '카드 한 장을 비교하는 것이 아니라 족보로 본다 — 페어가 에이스 하이보다 높다. ' +
      '지금은 ' + hi.name + '의 <b>' + handName(hi) + '</b>' + eunGa(handName(hi)) +
      (runner ? ' ' + runner.name + '의 ' + handName(runner) + ' 보다 높다.' : ' 가장 높다.') +
      (runner && handName(hi) === handName(runner)
        ? ' 이름은 같지만 <b>' + (tieBreakKo(upRank(hi), upRank(runner)) || '') + '</b> 한 장으로 갈린다.'
        : '');
    cite = { src: GUIDE, txt: '4번째 카드 이후 첫 액션은 가장 높은 업카드 — 보드에 뜬 족보 순서로 정한다.' };
  } else if (st.firstToAct === 'left-of-bb') {
    var utg = firstLiveFrom(3);
    if (!utg) return null;
    ans = utg.i;
    why = 'BB 왼쪽이 첫 액션이다. 버튼이 ' + seatByPos(0).name + ', BB 가 ' + seatByPos(2).name + ' 이므로 ' + seatByPos(3).name +
      (utg.pos !== 3 ? ' 인데 폴드했으니 그 다음 살아 있는 ' + utg.name + ' 이다.' : '.');
    cite = H.spec.id === 'nlh'
      ? { src: '사용자 확인 (2026-09-04)', txt: '노리밋 홀덤 프리플랍의 첫 액션은 BB 왼쪽(UTG).' }
      : H.spec.family === 'flop'
        ? { src: GUIDE, txt: '플랍게임 프리플랍의 첫 액션은 BB 왼쪽(UTG).' }
        : { src: GUIDE, txt: '2-7 트리플 드로우 첫 베팅 라운드의 첫 액션은 BB 왼쪽.' };
  } else {
    /* 자리로 정하는 첫 액션은 「그 자리부터 세어 폴드하지 않은 첫 좌석」이다.
       SB 가 죽었다고 라운드가 안 열리는 것이 아니다. */
    var sb = firstLiveFrom(1);
    if (!sb) return null;
    ans = sb.i;
    why = (H.spec.family === 'flop'
      ? '보드가 깔린 뒤부터는 버튼 왼쪽(SB)부터다. <b>프리플랍만 BB 왼쪽</b>이었고, 플랍에서 기준이 한 칸 앞으로 옮겨진다.'
      : '드로우 라운드부터는 버튼 왼쪽(SB)부터다. 교체 장수 확인도 SB 부터 시작한다.') +
      (sb.pos !== 1 ? ' 지금은 ' + seatByPos(1).name + ' 이 폴드해서 그 다음 살아 있는 <b>' + sb.name + '</b> 이 먼저다.' : '');
    cite = H.spec.id === 'nlh'
      ? { src: '사용자 확인 (2026-09-04)', txt: '노리밋 홀덤은 플랍 이후 버튼 왼쪽(SB)부터 액션한다.' }
      : H.spec.family === 'flop'
        ? { src: GUIDE, txt: '플랍게임은 플랍 이후 버튼 왼쪽(SB)부터 액션한다.' }
        : { src: GUIDE, txt: '드로우 순서는 버튼 왼쪽(SB)부터 장수 확인 → 번카드 1장 → SB 부터 회수·배분.' };
  }
  if (ans === null) return null;
  var s2 = H.seats[ans];
  if (s2.folded) return null;

  return {
    kind: 'seat', tone: '', kicker: '판단 · 액션 순서',
    q: (H.spec.family === 'stud' && ix === 0) ? '브링인은 누구입니까?' : '이번 베팅 라운드, 누가 먼저 액션합니까?',
    sub: H.stage + ' · 좌석을 직접 지목하세요.',
    answer: ans, why: why, cite: cite
  };
}
function seatByPos(p) { return H.seats.filter(function (s) { return s.pos === p; })[0]; }
/* 그 자리부터 시계 방향으로 세어 폴드하지 않은 첫 좌석 */
function firstLiveFrom(pos) {
  for (var k = 0; k < SEAT_N; k++) {
    var s = seatByPos((pos + k) % SEAT_N);
    if (s && !s.folded) return s;
  }
  return null;
}

// ═══════════════════════════════════════════════════
// 판단 2 — 벳 크기 (칩을 팟으로 민다)
// ═══════════════════════════════════════════════════
/* 「누가 먼저」와 「얼마」는 한 라운드를 여는 동작 하나다.
   두 화면으로 쪼개 놓으면 벳 크기가 2지선다로 남아 찍히고, 좌석 지목은 따로 반복된다.
   한 화면에서 좌석을 먼저 지목하고 이어서 금액을 낸다 — 둘 다 맞아야 정답이다. */
function mkAskOpen(ix) {
  var seatQ = mkAskSeat(ix);
  if (!seatQ) return null;
  /* 스터드의 첫 라운드는 그냥 「여는」 것이 아니라 브링인이다 — 이름을 그대로 부른다. */
  var openKo = (H.spec.family === 'stud' && ix === 0) ? '브링인' : '첫 순서 지목';
  return {
    kind: 'open', tone: '', kicker: '판단 · ' + openKo, openKo: openKo,
    q: seatQ.q, sub: seatQ.sub,
    answer: seatQ.answer, why: seatQ.why, cite: seatQ.cite,
    bet: mkAskBet(ix, H.seats[seatQ.answer].name), seatPicked: -1, typed: null
  };
}

/* 팟벳 = 콜 금액 + 콜한 뒤 팟에 있는 금액 (가이드 p2~p4).
   콜한 뒤의 팟에는 방금 넣은 콜도 들어 있으므로 콜 금액이 두 번 더해진다. */
function potBet(potNow, callAmt) { return callAmt * 2 + potNow; }

/* 팟리밋에서는 벳 크기가 선택이 아니라 계산이다. 그래서 숫자를 직접 받는다. */
function mkPotBet(ix, who) {
  var callAmt = ix === 0 ? BB : 0;
  var potNow = potNow_();
  var out = betsOut();
  var ans = potBet(potNow, callAmt);
  var why = callAmt
    ? '팟벳은 <b>콜 금액 + 콜한 뒤 팟에 있는 금액</b>이다. 콜 ' + won(callAmt) + ' 을 넣으면 팟이 ' +
      won(potNow) + ' + ' + won(callAmt) + ' = ' + won(potNow + callAmt) +
      ' 이 되고, 거기에 콜 금액을 더해 <b>' + won(ans) + '</b> 이다. 앤티는 팟 계산에서 뺀다.'
    : '앞에 벳이 없으면 콜 금액이 0 이라 팟벳은 <b>팟 금액 그대로</b>인 ' + won(ans) + ' 이다. ' +
      '공식은 같다 — 콜 0 + 콜한 뒤 팟 ' + won(potNow) + '.';
  return {
    q: (who || '이 좌석') + '이 <b>팟벳</b>을 하면 얼마입니까?',
    sub: '팟 <b>' + won(potNow) + '</b>' +
      (out ? ' (가운데 ' + won(H.pot) + ' + 앞에 놓인 칩 ' + won(out) + ')' : '') +
      (callAmt ? ' · 콜 금액 <b>' + won(callAmt) + '</b>' : ' · 앞에 벳 없음'),
    input: 'amount', amount: ans,
    why: why,
    cite: { src: GUIDE, txt: '팟벳 = 마지막 배팅을 콜 하는 데 필요한 금액 + 콜 한 후에 팟에 있는 금액. 앤티는 프리플랍 팟 계산에서 제외하는 것이 보편적이다 (대회사마다 다를 수 있음).' }
  };
}

/* 가이드의 두 번째 예제가 이것이다 — 앞선 팟벳을 다시 팟까지 올리는 금액.
   **벳을 화면에 실제로 놓고 묻는다.** 팟리밋 계산은 머리로 그리는 일이 아니라
   테이블에 있는 칩을 세는 일이다. 가정 문제가 아니라 이 라운드의 진짜 벳이라,
   뒤이은 베팅과 수거로 그대로 이어진다. */
function mkPotRaise(ix) {
  var list = actives();
  if (list.length < 2) return null;
  var bettor = pick(list);
  var rest = list.filter(function (x) { return x.i !== bettor.i; });
  var hero = pick(rest);
  var potBefore = potNow_();
  var outBefore = betsOut();
  var bet = Math.max(BB, Math.round(potBefore * (0.5 + rnd(3) * 0.25) / CHIPUNIT) * CHIPUNIT);
  var potNow = potBefore + bet;
  var ans = potBet(potNow, bet);

  bettor.bet = Math.max(bettor.bet, bet);
  H.flags.hotSeat = hero.i;
  log(bettor.name + ' 벳 <b>' + won(bet) + '</b>');
  render();

  return {
    kind: 'amount', tone: '', kicker: '판단 · 팟리밋 계산',
    q: hero.name + '이 <b>팟까지 레이즈</b>하면 얼마를 냅니까?',
    sub: '화면의 칩을 세십시오 — 팟 <b>' + won(potBefore) + '</b>' +
      (outBefore ? ' (가운데 ' + won(H.pot) + ' + 앞에 놓인 칩 ' + won(outBefore) + ')' : '') +
      ' · ' + bettor.name + '의 벳 <b>' + won(bet) + '</b>',
    input: 'amount', amount: ans,
    why: '먼저 콜 ' + won(bet) + ' 을 넣는다. 그러면 팟이 ' + won(potBefore) + ' + ' + won(bet) + ' + ' + won(bet) +
         ' = ' + won(potNow + bet) + ' 이 되고, 거기에 콜 금액을 더해 <b>' + won(ans) + '</b> 이다.',
    cite: { src: GUIDE, txt: '팟벳 = 콜 금액 + 콜 한 후에 팟에 있는 금액. 예 — 팟 60,000 에 40,000 벳이면 40,000 + (60,000+40,000) = 140,000.' }
  };
}

function mkAskBet(ix, who) {
  var st = H.spec.streets[ix];
  if (H.spec.betting === 'PL') return mkPotBet(ix, who);
  /* 노리밋은 BB 부터 스택 전부까지라 정답이 하나가 아니다 — 묻지 않는다 (ADR-003). */
  if (H.spec.betting === 'NL') return null;
  var isBig = st.size === 2;
  var why, cite;
  if (H.spec.family === 'stud') {
    /* 3번째 카드의 첫 벳은 스몰벳이 아니라 브링인 금액이다. */
    if (ix === 0) {
      return {
        kind: 'incident', tone: '', kicker: '판단 · 벳 크기',
        q: '브링인은 얼마를 냅니까?',
        sub: H.stage,
        choices: ['브링인 ' + won(BRINGIN), '스몰벳 ' + won(SMALL) + ' — 컴플리트', '빅벳 ' + won(BIG)],
        correct: 0,
        target: null,
        why: '3번째 카드의 첫 벳은 <b>브링인 금액</b>이다. 브링인을 낸 사람이 원하면 스몰벳까지 ' +
             '컴플리트할 수 있고, 컴플리트는 첫 벳으로 친다.',
        cite: { src: GUIDE, txt: '3번째 카드 첫 액션은 가장 낮은 업카드 — 브링인 금액을 내거나 컴플리트한다.' }
      };
    }
    /* 4번째 카드에 오픈페어가 있으면 빅벳을 고를 수 있다 — 정답이 하나가 아니므로 묻지 않는다 (ADR-003). */
    if (ix === 1 && H.spec.eval.hi && openPair(actives())) return null;
    why = isBig
      ? '스터드는 5번째 카드부터 빅벳이다.'
      : (H.spec.eval.hi
          ? '4번째 카드는 스몰벳이다. 단 업카드에 페어가 뜨면 빅벳을 고를 수 있다.'
          : '4번째 카드는 스몰벳이다.');
    cite = { src: GUIDE, txt: '픽스리밋 2배 지점 — 스터드는 5번째 카드부터.' };
  } else {
    var roundNo = ix + 1;
    why = isBig
      ? '드로우게임은 3번째 베팅 라운드부터 2배다. 지금이 ' + roundNo + '번째 베팅 라운드다.'
      : '아직 ' + roundNo + '번째 베팅 라운드라 스몰벳이다.';
    cite = { src: GUIDE, txt: '픽스리밋 2배 지점 — 드로우게임은 3번째 베팅 라운드부터.' };
  }
  return {
    kind: 'incident', tone: '', kicker: '판단 · 벳 크기',
    q: '지금 벳은 스몰벳입니까, 빅벳입니까?',
    sub: H.stage,
    choices: ['스몰벳 ' + won(SMALL), '빅벳 ' + won(BIG)],
    correct: isBig ? 1 : 0,
    target: null,
    why: why, cite: cite
  };
}

// ═══════════════════════════════════════════════════
// 승자 판정 — 평가기 하나로 하이와 2-7 로우볼을 둘 다 낸다
//
// 2-7 로우볼은 별개 알고리즘이 아니다. 표준 하이 평가기를 그대로 쓰되
//   · A 를 낮게 쓰지 않고 (휠이 스트레이트가 아니다)
//   · 비교를 뒤집는다 (가장 나쁜 하이 핸드가 이긴다)
// 그래서 최고 로우가 7-5-4-3-2 무플러시가 된다.
// ═══════════════════════════════════════════════════
var CATKO = ['하이카드', '원페어', '투페어', '트리플', '스트레이트',
             '플러시', '풀하우스', '포카드', '스트레이트 플러시'];

function evalFive(cards, aceLow) {
  var i, k;
  var suit = {}, counts = {};
  for (i = 0; i < cards.length; i++) {
    suit[cards[i].su.s] = (suit[cards[i].su.s] || 0) + 1;
    var v = rv(cards[i]);
    counts[v] = (counts[v] || 0) + 1;
  }
  var flush = false;
  for (k in suit) if (suit.hasOwnProperty(k) && suit[k] === 5) flush = true;

  var groups = [];
  for (k in counts) if (counts.hasOwnProperty(k)) groups.push({ v: parseInt(k, 10), n: counts[k] });
  groups.sort(function (a, b) { return b.n - a.n || b.v - a.v; });
  var uniq = groups.map(function (x) { return x.v; }).slice().sort(function (a, b) { return b - a; });

  var straight = false, top = -1;
  if (groups.length === 5) {
    if (uniq[0] - uniq[4] === 4) { straight = true; top = uniq[0]; }
    else if (aceLow && uniq[0] === 12 && uniq[1] === 3 && uniq[4] === 0) { straight = true; top = 3; }
  }

  var cat, key, plain = groups.map(function (x) { return x.v; });
  if (straight && flush) { cat = 8; key = [cat, top]; }
  else if (groups[0].n === 4) { cat = 7; key = [cat].concat(plain); }
  else if (groups[0].n === 3 && groups[1] && groups[1].n === 2) { cat = 6; key = [cat].concat(plain); }
  else if (flush) { cat = 5; key = [cat].concat(uniq); }
  else if (straight) { cat = 4; key = [cat, top]; }
  else if (groups[0].n === 3) { cat = 3; key = [cat].concat(plain); }
  else if (groups[0].n === 2 && groups[1] && groups[1].n === 2) { cat = 2; key = [cat].concat(plain); }
  else if (groups[0].n === 2) { cat = 1; key = [cat].concat(plain); }
  else { cat = 0; key = [cat].concat(uniq); }

  return { cat: cat, key: key, cards: cards.slice(), top: plain[0] };
}

/* 7장이면 21가지 조합에서 최고 5장을 고른다. */
function bestFive(cards, aceLow) {
  if (cards.length <= 5) return evalFive(cards, aceLow);
  var n = cards.length, best = null, a, b, c, d, e;
  for (a = 0; a < n; a++) for (b = a + 1; b < n; b++) for (c = b + 1; c < n; c++)
    for (d = c + 1; d < n; d++) for (e = d + 1; e < n; e++) {
      var h = evalFive([cards[a], cards[b], cards[c], cards[d], cards[e]], aceLow);
      if (!best || cmpKey(h.key, best.key) > 0) best = h;
    }
  return best;
}

function handKo(h, lowball) {
  var r = RANKS;
  if (lowball) {
    var line = h.cards.map(rv).sort(function (x, y) { return y - x; })
      .map(function (v) { return r[v]; }).join('-');
    return h.cat === 0 ? line : line + ' (' + CATKO[h.cat] + ')';
  }
  if (h.cat === 8) return r[h.key[1]] + ' 하이 스트레이트 플러시';
  if (h.cat === 7) return r[h.key[1]] + ' 포카드';
  if (h.cat === 6) return r[h.key[1]] + ' 풀하우스';
  if (h.cat === 5) return r[h.key[1]] + ' 하이 플러시';
  if (h.cat === 4) return r[h.key[1]] + ' 하이 스트레이트';
  if (h.cat === 3) return r[h.key[1]] + ' 트리플';
  if (h.cat === 2) return r[h.key[1]] + '·' + r[h.key[2]] + ' 투페어';
  if (h.cat === 1) return r[h.key[1]] + ' 페어';
  return r[h.key[1]] + ' 하이';
}


/* ── A-5 로우볼 ────────────────────────────────────
   A 가 최저이고 스트레이트·플러시를 무시한다. 그래서 최고 로우가 5-4-3-2-A 다.
   8-or-better 는 별개 평가기가 아니라 이 위에 얹은 자격 규칙이다 (PRD §6-3). */
var A5RANK = ['A', '2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K'];
var LOWCAT = { 0: '', 1: '원페어', 2: '투페어', 3: '트리플', 7: '포카드' };

function a5v(c) { return c.r === 'A' ? 0 : rv(c) + 1; }
function a5vOf(n) { return n - 1; }          // 숫자 8 → 값 7

function evalLowA5(cards) {
  var counts = {}, i, k;
  for (i = 0; i < cards.length; i++) {
    var v = a5v(cards[i]);
    counts[v] = (counts[v] || 0) + 1;
  }
  var groups = [];
  for (k in counts) if (counts.hasOwnProperty(k)) groups.push({ v: parseInt(k, 10), n: counts[k] });
  groups.sort(function (a, b) { return b.n - a.n || b.v - a.v; });
  var cat = groups[0].n >= 4 ? 7
          : groups[0].n === 3 ? 3
          : (groups[0].n === 2 && groups[1] && groups[1].n === 2) ? 2
          : groups[0].n === 2 ? 1 : 0;
  var key = [cat];
  for (i = 0; i < groups.length; i++) key.push(groups[i].v);
  return { cat: cat, key: key, cards: cards.slice() };
}

function combos5(cards, fn) {
  var n = cards.length, a, b, c, d, e;
  if (n <= 5) { fn(cards); return; }
  for (a = 0; a < n; a++) for (b = a + 1; b < n; b++) for (c = b + 1; c < n; c++)
    for (d = c + 1; d < n; d++) for (e = d + 1; e < n; e++)
      fn([cards[a], cards[b], cards[c], cards[d], cards[e]]);
}

/* qualifier 가 있으면 페어 없이 다섯 장 전부 그 숫자 이하여야 로우가 성립한다.
   성립하지 않으면 null — 하이가 팟을 전부 가져간다. */
function bestLowA5(cards, qualifier) {
  var best = null;
  combos5(cards, function (five) {
    if (five.length < 5) return;
    var h = evalLowA5(five);
    if (qualifier) {
      if (h.cat !== 0) return;
      if (h.key[1] > a5vOf(qualifier)) return;
    }
    if (!best || cmpKey(h.key, best.key) < 0) best = h;
  });
  return best;
}

/* ── 바두기 ────────────────────────────────────────
   숫자도 무늬도 겹치지 않는 카드만 핸드로 친다. 넷을 다 살리면 4베이스,
   하나라도 겹치면 3베이스로 내려간다. 베이스가 많은 쪽이 무조건 이기고,
   같으면 높은 카드부터 비교해 낮은 쪽이 이긴다. A 가 최저다. (가이드 p6~7)

   그래서 최고 핸드는 무늬가 모두 다른 4-3-2-A 다. */
function evalBadugi(cards) {
  var best = null, i, sub, k;
  /* 4장이면 부분집합이 16개뿐이라 전부 본다 */
  for (i = 1; i < (1 << cards.length); i++) {
    sub = [];
    for (k = 0; k < cards.length; k++) if (i & (1 << k)) sub.push(cards[k]);
    var ranks = {}, suits = {}, okSet = true;
    for (k = 0; k < sub.length; k++) {
      var rk = sub[k].r, sk = sub[k].su.s;
      if (ranks[rk] || suits[sk]) { okSet = false; break; }
      ranks[rk] = 1; suits[sk] = 1;
    }
    if (!okSet) continue;
    var vals = sub.map(a5v).sort(function (x, y) { return y - x; });
    /* 베이스가 많을수록 앞자리가 작아진다 — cmpKey 에서 작은 쪽이 이긴다 */
    var key = [cards.length - sub.length].concat(vals);
    if (!best || cmpKey(key, best.key) < 0) best = { base: sub.length, key: key, cards: sub.slice() };
  }
  return best;
}
function badugiKo(h) {
  var line = h.cards.map(a5v).sort(function (x, y) { return y - x; })
    .map(function (v) { return A5RANK[v]; }).join('-');
  return h.base + '베이스 ' + line;
}

/* ── 오마하 강제 조합 ──────────────────────────────
   홀 4장 중 반드시 2장, 보드 5장 중 반드시 3장이다. 7장 자유 조합과 결과가 다르다 —
   보드에 같은 무늬가 넉 장 떠도 홀에 그 무늬가 2장 없으면 플러시가 아니다. (가이드 p4~5) */
function omahaCombos(hole, board, fn) {
  var a, b, c, d, e;
  if (board.length < 3 || hole.length < 2) return;
  for (a = 0; a < hole.length; a++) for (b = a + 1; b < hole.length; b++)
    for (c = 0; c < board.length; c++) for (d = c + 1; d < board.length; d++)
      for (e = d + 1; e < board.length; e++)
        fn([hole[a], hole[b], board[c], board[d], board[e]]);
}
function bestOmahaHi(hole, board) {
  var best = null;
  omahaCombos(hole, board, function (five) {
    var h = evalFive(five, true);
    if (!best || cmpKey(h.key, best.key) > 0) best = h;
  });
  return best;
}
function bestOmahaLow(hole, board, qualifier) {
  var best = null;
  omahaCombos(hole, board, function (five) {
    var h = evalLowA5(five);
    if (qualifier) {
      if (h.cat !== 0) return;
      if (h.key[1] > a5vOf(qualifier)) return;
    }
    if (!best || cmpKey(h.key, best.key) < 0) best = h;
  });
  return best;
}
/* 보드에 8 이하가 세 장 없으면 누구도 로우를 만들 수 없다 — 홀을 볼 것도 없다. */
function boardLowCards(board, qualifier) {
  var c = 0;
  for (var i = 0; i < board.length; i++) if (a5v(board[i]) <= a5vOf(qualifier)) c++;
  return c;
}

function lowKo(h) {
  var line = h.cards.map(a5v).sort(function (x, y) { return y - x; })
    .map(function (v) { return A5RANK[v]; }).join('-');
  return h.cat === 0 ? line : line + ' (' + LOWCAT[h.cat] + ')';
}

/* ── 누가 먼저 액션하나 ────────────────────────────
   종목마다 방향이 다르다. Razz 는 스터드와 반대다. */
function actorCmp(a, b, mode) {          // a 가 먼저면 양수
  if (mode === 'lowest-upcard')     return rv(b.up[0]) - rv(a.up[0]);
  if (mode === 'highest-upcard-a5') return a5v(a.up[0]) - a5v(b.up[0]);
  if (mode === 'highest-upcard-rank') return rv(a.up[0]) - rv(b.up[0]);
  if (mode === 'highest-upcard')    return cmpKey(upRank(a).key, upRank(b).key);
  if (mode === 'lowest-hand')       return -cmpKey(evalLowA5(a.up).key, evalLowA5(b.up).key);
  return 0;
}
function actorSeat(list, mode) {
  if (!list.length) return null;
  var best = null, tied = false, i;
  for (i = 0; i < list.length; i++) {
    if (best === null) { best = list[i]; continue; }
    var c = actorCmp(list[i], best, mode);
    if (c > 0) { best = list[i]; tied = false; }
    else if (c === 0) tied = true;
  }
  return tied ? null : best;
}
function bringInKo(spec) {
  var m = spec.streets[0].firstToAct;
  return (m === 'highest-upcard-a5' || m === 'highest-upcard-rank') ? '가장 높은 업카드' : '가장 낮은 업카드';
}

/* ── 쇼다운 ────────────────────────────────────────
   하이만, 로우만, 하이/로우 스플릿 세 경우를 한 곳에서 낸다. */
/* 그 좌석이 판정에 쓰는 카드. 플랍게임은 보드가 공용이라 손패에 보드를 더한다 —
   이걸 빠뜨리면 홀덤이 홀 2장만으로 판정된다. 오마하만 예외로 따로 센다 (강제 조합). */
function playCards(s) {
  return H.spec.family === 'flop' ? s.down.concat(H.board) : s.down.concat(s.up);
}

function showdownResult() {
  var spec = H.spec, ev = spec.eval, list = actives(), i;
  var om = spec.omaha;
  var hi = null, lo = null;
  if (ev.hi) {
    hi = list.map(function (s) {
      return { seat: s, h: om ? bestOmahaHi(s.down, H.board) : bestFive(playCards(s), true) };
    });
    hi = hi.filter(function (x) { return !!x.h; });
    hi.sort(function (x, y) { return -cmpKey(x.h.key, y.h.key); });
  }
  if (ev.lo === '27') {
    lo = list.map(function (s) { return { seat: s, h: bestFive(playCards(s), false) }; });
    lo.sort(function (x, y) { return cmpKey(x.h.key, y.h.key); });
  } else if (ev.lo === 'badugi') {
    lo = list.map(function (x) { return { seat: x, h: evalBadugi(x.down) }; });
    lo.sort(function (x, y) { return cmpKey(x.h.key, y.h.key); });
  } else if (ev.lo === 'a5') {
    lo = [];
    for (i = 0; i < list.length; i++) {
      var h = om ? bestOmahaLow(list[i].down, H.board, ev.qualifier)
                 : bestLowA5(playCards(list[i]), ev.qualifier);
      if (h) lo.push({ seat: list[i], h: h });
    }
    lo.sort(function (x, y) { return cmpKey(x.h.key, y.h.key); });
  }
  function tiedTop(arr, dir) {
    if (!arr || arr.length < 2) return false;
    return cmpKey(arr[0].h.key, arr[1].h.key) === 0;
  }
  return {
    hi: hi, lo: lo,
    hiTied: tiedTop(hi), loTied: tiedTop(lo),
    split: !!(ev.hi && ev.lo),
    loKind: ev.lo
  };
}
/* 족보 이름이 양쪽 다 같게 나오는 경우가 있다 — 보드를 같이 쓰는 홀덤에서 흔하다.
   "K·J 투페어가 K·J 투페어를 이긴다"는 아무것도 설명하지 못한다.
   키를 앞에서부터 훑어 처음 갈리는 자리를 찾아, 무엇 한 장으로 갈렸는지 말해 준다. */
function tieBreakKo(win, run) {
  var i, m = Math.max(win.key.length, run.key.length);
  for (i = 1; i < m; i++) {
    var x = i < win.key.length ? win.key[i] : -1;
    var y = i < run.key.length ? run.key[i] : -1;
    if (x !== y) return RANKS[x] || null;
  }
  return null;
}

function handNameOf(e, kind) {
  if (kind === 'a5') return lowKo(e.h);
  if (kind === 'badugi') return badugiKo(e.h);
  return handKo(e.h, kind === '27');
}

var CHIPUNIT = 500;   // 홀칩은 이 단위로 갈린다

function mkAskWinner() {
  var r = showdownResult();
  H.sd = r;
  var main = r.hi || r.lo;
  var kind = r.hi ? 'hi' : r.loKind;
  if (!main || main.length < 2) { log('한 명만 남아 팟을 그대로 지급한다'); return null; }
  if (r.hi ? r.hiTied : r.loTied) { log('동점 — 팟을 나눈다', 'hi'); return null; }
  var win = main[0], run = main[1];
  var head = r.split ? '하이는 누가 이깁니까?' : '이 팟은 누구에게 갑니까?';
  var lead;
  if (kind === 'hi') lead = H.spec.omaha
    ? '오마하는 <b>홀 4장 중 2장 + 보드 5장 중 3장</b>이 강제다. 보드에 무늬가 넉 장 떠도 홀에 그 무늬가 2장 없으면 플러시가 아니다. '
    : H.spec.family === 'flop'
      ? '홀덤은 홀 2장과 보드 5장, <b>일곱 장 중 최고 다섯 장</b>을 자유롭게 고른다. 강제 조합이 없어 <b>보드만으로도 칠 수 있다</b> — 오마하와 갈리는 지점이 그것이다. '
      : '7장 중 최고 5장으로 겨룬다. ';
  else if (kind === '27') lead = '2-7 로우볼은 <b>가장 낮은 핸드</b>가 이긴다. A 는 항상 높고 스트레이트·플러시는 인정되므로 손해다. ';
  else if (kind === 'badugi') lead = '바두기는 <b>숫자도 무늬도 겹치지 않는 카드만</b> 친다. 베이스가 많은 쪽이 무조건 이기고, 같으면 낮은 쪽이 이긴다. ';
  else lead = '<b>A-5 로우볼은 A 가 최저</b>이고 스트레이트·플러시를 따지지 않는다. 가장 낮은 다섯 장이 이긴다. ';
  return {
    kind: 'seat', tone: '', kicker: '판단 · 팟 지급',
    q: head,
    sub: '쇼다운 · 좌석을 클릭하세요.',
    answer: win.seat.i,
    why: (function () {
      var wn = handNameOf(win, kind), rn = handNameOf(run, kind);
      var tb = (kind === 'hi' && wn === rn) ? tieBreakKo(win.h, run.h) : null;
      return lead + win.seat.name + '의 <b>' + wn + '</b>' + eunGa(wn) + ' ' +
        run.seat.name + '의 ' + rn + eulReul(rn) + ' 이긴다.' +
        (tb ? ' 족보 이름은 같고 <b>' + tb + '</b> 한 장으로 갈린다 — 다섯 장을 끝까지 비교한다.' : '');
    })(),
    cite: kind === 'hi'
      ? (H.spec.omaha
          ? { src: GUIDE, txt: 'PLO — 홀카드 4장, 쇼다운에 홀 2장 + 보드 3장 강제. 족보는 홀덤과 동일.' }
          : H.spec.family === 'flop'
            ? { src: '사용자 확인 (2026-09-04)', txt: '노리밋 홀덤 — 홀 2장 + 보드 5장, 일곱 장 중 최고 다섯 장 자유 조합. 강제 조합이 없다. 자료에 규칙 서술이 없어 확정받았다.' }
            : { src: GUIDE, txt: '7카드 스터드 — 7장 중 최고 5장. 족보는 홀덤과 동일.' })
      : kind === '27'
        ? { src: GUIDE, txt: '2-7 — A 는 최고, 스트레이트·플러시 인정. 최고 핸드는 7-5-4-3-2 무플러시.' }
        : kind === 'badugi'
          ? { src: GUIDE, txt: '바두기 — 페어 없고 무늬 겹치지 않는 낮은 4장. 최고는 무늬가 모두 다른 A-2-3-4. A 가 최저.' }
          : H.spec.id === 'razz'
            ? { src: '사용자 확인 (2026-09-03)', txt: '라즈는 A-5 로우볼 — A 가 최저, 스트레이트·플러시 무시, 자격 없음.' }
            : { src: PROTO, txt: 'Hi-Low Regular 는 로우에 자격이 없다 — A-5 로우볼 그대로다.' }
  };
}

/* 스플릿 게임에서만 나온다. 로우가 성립하는지부터 묻고, 성립하면 누구인지 지목한다. */
function mkAskLow() {
  var r = H.sd;
  if (!r || !r.split) return null;
  var has = !!(r.lo && r.lo.length);
  if (has && r.loTied) { log('로우 동점 — 로우 몫을 나눈다', 'hi'); return null; }

  /* 자격이 없으면 로우는 언제나 성립한다 — 물을 것이 「누가」뿐이다.
     이 한 줄이 스터드8 과 레귤러를 가른다. */
  if (!H.spec.eval.qualifier) {
    if (!has) return null;
    return {
      kind: 'seat', tone: '', kicker: '판단 · 로우',
      q: '로우는 누가 이깁니까?',
      sub: '자격이 없는 하이로우입니다 — 로우는 <b>언제나 성립합니다.</b> 좌석을 클릭하세요.',
      answer: r.lo[0].seat.i,
      why: r.lo[0].seat.name + '의 <b>' + lowKo(r.lo[0].h) + '</b>' + eunGa(lowKo(r.lo[0].h)) + ' 가장 낮다. ' +
           '8 이하 자격이 없으므로 K 하이라도 최저면 로우를 가져간다 — 스터드8 과 갈리는 지점이다. ' +
           '팟의 절반이고, 홀칩은 하이 승자에게 간다.',
      cite: { src: PROTO, txt: 'Hi-Low Regular — 로우에 자격(8-or-better)이 없다.' }
    };
  }

  return {
    kind: 'incident', tone: '', kicker: '판단 · 로우',
    q: '이 핸드에 <b>8 이하 로우</b>가 성립합니까?',
    sub: H.spec.omaha
      ? '보드의 8 이하가 <b>' + boardLowCards(H.board, H.spec.eval.qualifier || 8) + '장</b>입니다. 로우도 보드에서 3장을 써야 합니다.'
      : '로우는 A 가 최저이고 스트레이트·플러시를 따지지 않습니다. 페어가 있으면 로우가 아닙니다.',
    choices: ['로우가 성립한다', '로우가 없다 — 하이가 팟을 전부 가져간다'],
    correct: has ? 0 : 1,
    target: has ? { kind: 'seat', prompt: '로우는 누가 이깁니까?', answer: r.lo[0].seat.i } : null,
    why: has
      ? r.lo[0].seat.name + '의 <b>' + lowKo(r.lo[0].h) + '</b>' + eunGa(lowKo(r.lo[0].h)) +
        ' 로우를 가져간다. 팟의 절반이고, 홀칩은 하이 승자에게 간다.'
      : (H.spec.omaha && boardLowCards(H.board, 8) < 3
          ? '<b>보드에 8 이하가 세 장이 안 된다.</b> 로우도 보드에서 반드시 3장을 써야 하므로 홀카드를 볼 것도 없이 로우가 불가능하다. 하이가 팟을 전부 가져간다.'
          : '페어 없이 8 이하 다섯 장을 만든 사람이 없다. 로우가 성립하지 않으면 하이가 팟을 전부 가져간다.'),
    cite: { src: GUIDE, txt: 'Lo 족보는 A-5 와 일치하되 8 이하만 인정된다. 로우를 만들 수 없으면 Hi 승자에게 팟 전부. 홀칩은 Hi 승자에게.' }
  };
}

/* 팟을 실제로 나눈다 — 절반씩, 남는 칩은 하이에게. */
function payoutLine() {
  var r = H.sd;
  if (r && r.split && r.lo && r.lo.length && r.hi && r.hi.length) {
    var half = Math.floor(H.pot / 2 / CHIPUNIT) * CHIPUNIT;
    var odd = H.pot - half * 2;
    return '하이 ' + r.hi[0].seat.name + ' <b>' + won(half + odd) + '</b> · 로우 ' +
      r.lo[0].seat.name + ' <b>' + won(half) + '</b>' + (odd ? ' (홀칩 ' + won(odd) + ' 은 하이에게)' : '');
  }
  return '팟 <b>' + won(H.pot) + '</b> 지급';
}

function mkIncident(ix) {
  var spec = H.spec, st = spec.streets[ix], list = actives();
  var cands = [];

  /* 플랍게임의 예외 처리는 자료에 없다 — mixgame-facts §3 의 노출·스텁 표는 스터드와 드로우만 다룬다.
     짐작으로 채우지 않는다. PLO8 은 사고 없이 판단만 낸다. */
  if (spec.family === 'flop') return null;

  if (spec.family === 'stud') {
    if (ix === 0) { cands.push('exp_stud_initial'); cands.push('exp_stud_twodown'); cands.push('bringin_clean'); cands.push('bringin_acted'); }
    if (ix > 0 && ix < 4) { cands.push('up_ident'); cands.push('up_mixed'); }
    if (ix === 4) { cands.push('exp_stud_7th'); }
  } else {
    if (ix === 0) { cands.push('exp_draw_initial'); }
    if (ix > 0) { cands.push('exp_draw_round'); cands.push('stub_short_draw'); }
  }
  if (!cands.length) return null;
  var id = pick(cands);
  var inc = INC[id](list, st, ix);
  if (!inc) return null;
  G.incidents++;
  inc.kind = 'incident'; inc.tone = 'alert'; inc.kicker = '사고 — ' + inc.title;
  log('사고 발생 — ' + inc.title, 'bad');
  return inc;
}

function mkObjection(ix) {
  var spec = H.spec, list = actives();
  if (list.length < 2) return null;
  var pool = spec.family === 'draw'
    ? (ix > 0 ? ['ob_count_short', 'ob_change_count', 'ob_change_card'] : [])
    : spec.family === 'flop'
      ? ['ob_potsize']
      : (ix === 0 ? ['ob_bringin'] : ['ob_order']);
  if (!pool.length) return null;
  var ob = OBJ[pick(pool)](list, ix);
  if (!ob) return null;
  ob.kind = 'incident'; ob.tone = 'talk'; ob.kicker = '항의 — ' + ob.who;
  log(ob.who + ' 항의', 'hi');
  return ob;
}
