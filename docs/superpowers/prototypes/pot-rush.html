<style>
:root {
  --ground:      #EFF3F1;
  --surface:     #FFFFFF;
  --surface-2:   #E4ECE8;
  --ink:         #0E1F1A;

  --felt-edge:   #085041;
  --felt-deep:   #04342C;
  --felt-ink:    #E1F5EE;

  --amber:       #EF9F27;
  --amber-ink:   #854F0B;
  --amber-bg:    #FAEEDA;

  --red:         #B23A2E;
  --red-ink:     #8E2C22;
  --red-bg:      #FBEBE8;

    --ink-2:       #9CB2AA;
    --ink-3:       #6E837C;
    --line:        #24372F;
    --line-strong: #354A41;
    --felt:        #0D6350;
    --felt-edge:   #073F33;
    --felt-deep:   #04241E;
    --felt-ink:    #D6EFE5;
    --amber-ink:   #FAEEDA;
    --amber-bg:    #3A2A0E;
    --red:         #D9705F;
    --red-ink:     #F0B8AE;
    --red-bg:      #33201C;
    --ok:          #4FBF9A;
    --ok-bg:       #103128;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --ground:      #0A1310;
  --surface:     #111E19;
  --surface-2:   #18291F;
  --ink:         #E6F0EC;

* { box-sizing: border-box; }

body {

  color: var(--ink);

.wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 56px; }

/* ── 상단 HUD ─────────────────────────────────── */

.hud {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.hud .brand {
  font-size: 15px; font-weight: 900;
  letter-spacing: -.02em;
}
.hud .spacer { flex: 1; }
.hud .stat {
  font-family: var(--mono);
  font-size: 12px;

}
.hud .stat b { color: var(--ink); font-weight: 800; }
.streak {
  font-family: var(--mono);
  font-size: 12px; font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--amber-bg);
  color: var(--amber-ink);
}

.timerbar {
  height: 5px;
  border-radius: 999px;
  background: var(--surface-2);

}

}
.timerbar i.warn { background: var(--amber); }
.timerbar i.crit { background: var(--red); }

/* ── 카드 ─────────────────────────────────────── */

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;

.kicker {

  letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
  padding: 13px 16px 0;
}
.qtext {
  font-size: 17px; font-weight: 700;
  letter-spacing: -.01em;
  padding: 3px 16px 12px;
  text-wrap: balance;
}

/* ── 펠트 ─────────────────────────────────────── */

.felt {
  position: relative;
  margin: 0 12px 12px;
  border-radius: 20px;
  padding: 16px 12px;
  background: radial-gradient(ellipse at 50% 0%,
              color-mix(in srgb, var(--felt) 85%, #fff) 0%, var(--felt) 55%, var(--felt-edge) 100%);
  box-shadow: inset 0 0 26px rgba(0,0,0,.28), 0 0 0 4px var(--felt-deep);
}

.board { display: flex; gap: 5px; justify-content: center; margin-bottom: 12px; }
.pcard {
  width: 34px; height: 47px;
  border-radius: 5px;
  background: #FBFBF8; color: #14231D;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 800;
  line-height: 1;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.pcard .r { font-size: 15px; }
.pcard .s { font-size: 13px; }
.pcard.red { color: #B23A2E; }
.pcard.sm { width: 26px; height: 36px; }
.pcard.sm .r { font-size: 12px; }
.pcard.sm .s { font-size: 10px; }

.rows { display: flex; flex-direction: column; gap: 7px; }

.prow {
  display: flex; align-items: center; gap: 9px;
  min-height: 56px;
  background: rgba(0,0,0,.17);
  border: 2px solid transparent;
  border-radius: 11px;
  padding: 7px 10px;
  color: var(--felt-ink);
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 13px;
}
button.prow { cursor: pointer; }
button.prow:hover, button.prow:focus-visible {
  border-color: #FBFBF8;
  background: rgba(0,0,0,.28);
  outline: none;
}
.prow.pick { border-color: var(--amber); background: rgba(239,159,39,.22); }
.prow.right { border-color: #6FE3B8; background: rgba(29,158,117,.3); }
.prow.wrong { border-color: var(--red); background: rgba(178,58,46,.28); }

.pname {

}

/* 칩 */
.chips { display: flex; gap: 11px; flex-wrap: wrap; align-items: flex-end; flex: 1; }
.stack { display: flex; flex-direction: column; align-items: center; min-width: 32px; }

}

  font-family: var(--mono);

  margin-top: 5px;
  white-space: nowrap;
}

/* ── 입력 ─────────────────────────────────────── */

.answer { padding: 0 16px 16px; }
.fields { display: flex; gap: 9px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
.field label {
  font-size: 10.5px; font-weight: 800;

}
.field input {
  font-family: var(--mono);
  font-size: 20px; font-weight: 800;
  font-variant-numeric: tabular-nums;

  padding: 11px 13px;
  border-radius: 11px;
  border: 1.5px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  width: 100%;
}
.field input:focus-visible { outline: 2px solid var(--felt); outline-offset: 1px; }

.go {
  width: 100%;
  margin-top: 11px;
  font-family: inherit;
  font-size: 16px; font-weight: 800;
  padding: 13px;
  border-radius: 12px;
  border: none;

.go:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.hint {

}

/* ── 피드백 ───────────────────────────────────── */

.flash {

}
.flash.on { display: block; }
.flash .hd { font-weight: 800; font-size: 16px; margin-bottom: 2px; }
.flash.good { background: var(--ok-bg); color: var(--ok); }
.flash.bad  { background: var(--red-bg); color: var(--red-ink); }
.flash .why { font-size: 13px; opacity: .9; margin-top: 3px; }
.flash .pts {
  font-family: var(--mono); font-weight: 800;

}

/* ── 결과 ─────────────────────────────────────── */

.result { padding: 26px 20px 22px; text-align: center; }
.result .big {
  font-family: var(--mono);

  letter-spacing: -.03em;
  line-height: 1;
  color: var(--felt);
}
.result .lbl {
  font-size: 11px; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 6px;
}
.result .best {
  margin-top: 14px;
  font-size: 13px;
  color: var(--ink-2);
}
.result .best b { color: var(--amber-ink); }
.newrec {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px; font-weight: 800;
  background: var(--amber); color: #3A2400;
  padding: 3px 11px; border-radius: 999px;
}
.bytype {
  margin: 18px 0 0;
  display: flex; flex-direction: column; gap: 6px;
  text-align: left;
}
.bytype .r {
  display: flex; align-items: baseline; gap: 10px;
  font-size: 13px;
  padding-bottom: 5px;
  border-bottom: 1px dashed var(--line);
}
.bytype .r .k { flex: 1; color: var(--ink-2); }
.bytype .r .v { font-family: var(--mono); font-weight: 800; }

.foot {
  margin-top: 18px;
  font-size: 12px;
  color: var(--ink-3);
  line-height: 1.6;
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

<div class="wrap">

  <div class="hud">
    <span class="brand">팟 판독 러시</span>
    <span class="streak off" id="streak">연속 0</span>
    <span class="spacer"></span>
    <span class="stat" id="qno">1 / 10</span>
    <span class="stat"><b id="score">0</b>점</span>
  </div>

  <div class="timerbar"><i id="tbar"></i></div>

  <div class="panel" id="panel"></div>

  <div class="foot">
    설계 확인용 프로토타입이다. 카드·칩·팟은 매번 새로 만들어진다 —
    같은 문제가 두 번 나오지 않는다.
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── 카드 ────────────────────────────────────────
  var RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
  var SUITS = ['♠','♥','♦','♣'];
  var NAMES = ['김도현','박서준','이민아','최우진','정하늘','강태호','윤소라','임재혁','한다은'];
  var DENOMS = [100000, 25000, 5000, 1000, 500, 100];
  var DENOM_VAR = {
    100000: 'var(--chip-100000)', 25000: 'var(--chip-25000)', 5000: 'var(--chip-5000)',
    1000: 'var(--chip-1000)', 500: 'var(--chip-500)', 100: 'var(--chip-100)'
  };

  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }
  function fmt(n) { return n.toLocaleString('ko-KR'); }

  function newDeck() {
    var d = [];
    for (var s = 0; s < 4; s++) for (var r = 0; r < 13; r++) d.push({ r: r, s: s });
    return shuffle(d);
  }
  function cardStr(c) { return RANKS[c.r] + SUITS[c.s]; }

  /** 칩 단위 분해 — 큰 단위부터 그리디. 엔진 chipBreakdown 과 같은 규칙. */
  function breakdown(amount) {
    var out = [], left = amount;
    DENOMS.forEach(function (d) {
      var n = Math.floor(left / d);
      if (n > 0) { out.push({ d: d, n: n }); left -= n * d; }
    });
    return out;
  }

  // ── 핸드 평가 (7장 중 최적 5장) ──────────────────
  function evaluate7(cards) {
    var best = null;
    for (var a = 0; a < 7; a++) for (var b = a + 1; b < 7; b++)
      for (var c = b + 1; c < 7; c++) for (var d = c + 1; d < 7; d++)
        for (var e = d + 1; e < 7; e++) {
          var v = rank5([cards[a], cards[b], cards[c], cards[d], cards[e]]);
          if (!best || cmp(v, best) > 0) best = v;
        }
    return best;
  }

  /** [카테고리, 타이브레이커...] — 클수록 강하다. */
  function rank5(cs) {
    var rs = cs.map(function (c) { return c.r; }).sort(function (x, y) { return y - x; });
    var ss = cs.map(function (c) { return c.s; });
    var flush = ss.every(function (x) { return x === ss[0]; });

    var uniq = rs.filter(function (v, i) { return rs.indexOf(v) === i; });
    var straightHi = -1;
    if (uniq.length === 5) {
      if (uniq[0] - uniq[4] === 4) straightHi = uniq[0];
      // A-2-3-4-5 (휠) — 에이스를 1로 쓴다
      else if (uniq[0] === 12 && uniq[1] === 3 && uniq[4] === 0) straightHi = 3;
    }

    var counts = {};
    rs.forEach(function (r) { counts[r] = (counts[r] || 0) + 1; });
    var groups = Object.keys(counts).map(function (k) { return { r: +k, n: counts[k] }; });
    groups.sort(function (x, y) { return y.n - x.n || y.r - x.r; });
    var shape = groups.map(function (g) { return g.n; }).join('');
    var ord = groups.map(function (g) { return g.r; });

    if (flush && straightHi >= 0) return [8, straightHi];
    if (shape === '41') return [7].concat(ord);
    if (shape === '32') return [6].concat(ord);
    if (flush) return [5].concat(rs);
    if (straightHi >= 0) return [4, straightHi];
    if (shape === '311') return [3].concat(ord);
    if (shape === '221') return [2].concat(ord);
    if (shape === '2111') return [1].concat(ord);
    return [0].concat(rs);
  }

  function cmp(a, b) {
    for (var i = 0; i < Math.max(a.length, b.length); i++) {
      var x = a[i] === undefined ? -1 : a[i], y = b[i] === undefined ? -1 : b[i];
      if (x !== y) return x - y;
    }
    return 0;
  }

  var CAT = ['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];
  function catName(v) { return CAT[v[0]]; }

  // ── 팟 계산 (엔진 buildPots 와 같은 규칙) ────────
  function buildPots(contribs, folded) {
    var levels = contribs.filter(function (c) { return c > 0; })
      .filter(function (v, i, a) { return a.indexOf(v) === i; })
      .sort(function (x, y) { return x - y; });
    var pots = [], prev = 0;
    levels.forEach(function (lv) {
      var amt = 0, elig = [];
      contribs.forEach(function (c, i) {
        var part = Math.min(c, lv) - Math.min(c, prev);
        if (part > 0) amt += part;
        if (c >= lv && !folded[i]) elig.push(i);
      });
      if (amt > 0) pots.push({ amount: amt, elig: elig });
      prev = lv;
    });
    return pots;
  }

  // ── 문제 생성 ───────────────────────────────────

  /** 1. 사이드팟 분리 — 올인 금액이 콜 금액보다 뚜렷하게 낮아야 문제가 산다 */
  function makeSidePots() {
    var n = 3 + rnd(2);                              // 3~4명
    var names = shuffle(NAMES).slice(0, n);
    var base = [1, 2, 3, 5][rnd(4)] * 1000;
    var top = base * (3 + rnd(3));                   // 끝까지 간 사람이 낸 금액
    var allIns = 1 + rnd(Math.max(1, Math.min(2, n - 2)));  // 사이드팟에 최소 2명이 남게
    var used = [];

    var seats = names.map(function (nm, i) {
      if (i >= allIns) return { name: nm, bet: top, allIn: false };
      var lv, guard = 0;
      do {
        lv = base * (1 + rnd(2)) + 100 * rnd(10);
        guard++;
      } while ((used.indexOf(lv) >= 0 || lv >= top) && guard < 50);
      used.push(lv);
      return { name: nm, bet: lv, allIn: true };
    });

    var contribs = seats.map(function (s) { return s.bet; });
    var pots = buildPots(contribs, seats.map(function () { return false; }));
    var fields = pots.slice(0, 3).map(function (p, i) {
      return { label: i === 0 ? '메인팟' : '사이드팟 ' + i, answer: p.amount };
    });
    return {
      type: 'side', kicker: '사이드팟 분리', limit: 45,
      q: '올인이 나왔다. 팟을 나눠라.',
      seats: seats, board: [],
      fields: fields,
      why: pots.map(function (p, i) {
        return (i === 0 ? '메인팟' : '사이드팟 ' + i) + ' ' + fmt(p.amount) +
          ' (참가 ' + p.elig.length + '명)';
      }).join(' · ')
    };
  }

  /** 2. 승자 판정 */
  function makeWinner() {
    var n = 2 + rnd(3);
    var deck = newDeck();
    var board = deck.splice(0, 5);
    var names = shuffle(NAMES).slice(0, n);
    var seats = names.map(function (nm) {
      var hole = deck.splice(0, 2);
      var v = evaluate7(hole.concat(board));
      return { name: nm, hole: hole, val: v };
    });
    var best = seats.reduce(function (a, s) { return cmp(s.val, a.val) > 0 ? s : a; }, seats[0]);
    var ties = seats.filter(function (s) { return cmp(s.val, best.val) === 0; });
    if (ties.length > 1) return makeWinner();   // 동점은 다음 유형에서 다룬다
    return {
      type: 'winner', kicker: '승자 판정', limit: 28,
      q: '쇼다운이다. 이 팟을 가져가는 좌석은?',
      seats: seats, board: board,
      choose: { answer: seats.indexOf(best) },
      why: best.name + ' — ' + catName(best.val) +
        ' · 2위는 ' + (function () {
          var rest = seats.filter(function (s) { return s !== best; });
          var second = rest.reduce(function (a, s) { return cmp(s.val, a.val) > 0 ? s : a; }, rest[0]);
          return second.name + ' ' + catName(second.val);
        })()
    };
  }

  /** 3. 팟별 지급 — 사이드팟 + 쇼다운을 한 번에 */
  function makePayout() {
    var n = 3 + rnd(2);
    var deck = newDeck();
    var board = deck.splice(0, 5);
    var names = shuffle(NAMES).slice(0, n);
    var base = [1, 2, 3, 5][rnd(4)] * 1000;
    var seats = names.map(function (nm, i) {
      var hole = deck.splice(0, 2);
      return {
        name: nm, hole: hole, val: evaluate7(hole.concat(board)),
        bet: i === 0 ? base + 100 * rnd(9) : base * (2 + rnd(2)) + 100 * rnd(9),
        allIn: i === 0
      };
    });
    var contribs = seats.map(function (s) { return s.bet; });
    var pots = buildPots(contribs, seats.map(function () { return false; }));
    var mainPot = pots[0];
    var winnerIdx = mainPot.elig.reduce(function (a, i) {
      return cmp(seats[i].val, seats[a].val) > 0 ? i : a;
    }, mainPot.elig[0]);
    var tie = mainPot.elig.filter(function (i) { return cmp(seats[i].val, seats[winnerIdx].val) === 0; });
    if (tie.length > 1) return makePayout();
    return {
      type: 'payout', kicker: '메인팟 지급', limit: 40,
      q: '메인팟 ' + fmt(mainPot.amount) + ' 은 누구에게 가나?',
      seats: seats, board: board,
      choose: { answer: winnerIdx },
      why: seats[winnerIdx].name + ' — ' + catName(seats[winnerIdx].val) +
        ' · 메인팟 참가 자격은 ' + mainPot.elig.length + '명이다'
    };
  }

  var MAKERS = [makeSidePots, makeSidePots, makeSidePots, makeSidePots,
                makeWinner, makeWinner, makeWinner,
                makePayout, makePayout, makePayout];

  var TYPE_LABEL = { side: '사이드팟 분리', winner: '승자 판정', payout: '메인팟 지급' };

  // ── 상태 ────────────────────────────────────────
  var S;
  function reset() {
    S = {
      qs: shuffle(MAKERS).map(function (f) { return f(); }),
      i: 0, score: 0, streak: 0, best: 0,
      correct: 0,
      byType: {},
      picked: null, locked: false,
      t: 0, limit: 0, timer: null
    };
    render();
  }

  function $(s) { return document.querySelector(s); }

  function bestScore() {
    try { return parseInt(localStorage.getItem('potrush.best') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) { try { localStorage.setItem('potrush.best', String(v)); } catch (e) {} }

  // ── 렌더 ────────────────────────────────────────
  function chipHtml(amount) {
    return '<span class="chips">' + breakdown(amount).map(function (g) {
      var discs = '';
      var show = Math.min(g.n, 6);
      for (var i = 0; i < show; i++)
        discs += '<span class="chip" style="background:' + DENOM_VAR[g.d] + '"></span>';
      return '<span class="stack"><span class="pile">' + discs + '</span>' +
        '<span class="cnt">' + (g.d >= 1000 ? (g.d / 1000) + 'K' : g.d) +
        (g.n > 6 ? ' ×' + g.n : '') + '</span></span>';
    }).join('') + '</span>';
  }

  function cardHtml(c, sm) {
    var red = c.s === 1 || c.s === 2;
    return '<span class="pcard' + (red ? ' red' : '') + (sm ? ' sm' : '') + '">' +
      '<span class="r">' + RANKS[c.r] + '</span><span class="s">' + SUITS[c.s] + '</span></span>';
  }

  function render() {
    if (S.i >= S.qs.length) return renderResult();
    var q = S.qs[S.i];

    /*
     * 잠금을 여기서 먼저 푼다. startTimer 에서 풀면 이전 문제의 locked=true 상태로
     * 화면이 그려져 **정답 금액이 미리 보인다** (1번 문제만 멀쩡해서 놓치기 쉽다).
     */
    S.locked = false;
    S.picked = null;

    $('#qno').textContent = (S.i + 1) + ' / ' + S.qs.length;
    $('#score').textContent = fmt(S.score);
    var st = $('#streak');
    st.textContent = '연속 ' + S.streak;
    st.className = 'streak' + (S.streak >= 2 ? '' : ' off');

    var chooseMode = !!q.choose;

    var rows = q.seats.map(function (s, i) {
      var tag = s.allIn ? '<span class="pallin">올인</span>' : '';
      var mid = chooseMode
        ? '<span class="phand">' + s.hole.map(function (c) { return cardHtml(c, true); }).join('') + '</span>' +
          '<span class="pgrow"></span>' +
          (q.type === 'payout' ? '<span class="pamt">' + fmt(s.bet) + '</span>' : '')
        : chipHtml(s.bet) + '<span class="pamt">' + (S.locked ? fmt(s.bet) : '?') + '</span>';
      var tagName = chooseMode ? 'button' : 'div';
      return '<' + tagName + ' class="prow" data-i="' + i + '"' +
        (chooseMode ? ' type="button"' : '') + '>' +
        '<span class="pname">' + s.name + tag + '</span>' + mid +
        '</' + tagName + '>';
    }).join('');

    var boardHtml = q.board.length
      ? '<div class="board">' + q.board.map(function (c) { return cardHtml(c); }).join('') + '</div>'
      : '';

    var answerHtml = chooseMode
      ? '<div class="answer"><div class="hint">위에서 좌석을 누르세요.</div></div>'
      : '<div class="answer"><div class="fields">' +
          q.fields.map(function (f, i) {
            return '<div class="field"><label>' + f.label + '</label>' +
              '<input type="text" inputmode="numeric" class="fin" data-i="' + i + '" placeholder="0"></div>';
          }).join('') +
        '</div><button class="go" id="go" type="button">확인</button></div>';

    $('#panel').innerHTML =
      '<div class="kicker">' + q.kicker + '</div>' +
      '<div class="qtext">' + q.q + '</div>' +
      '<div class="felt">' + boardHtml + '<div class="rows">' + rows + '</div></div>' +
      answerHtml +
      '<div class="flash" id="flash"></div>';

    if (chooseMode) {
      Array.prototype.forEach.call(document.querySelectorAll('button.prow'), function (b) {
        b.addEventListener('click', function () { answerChoice(+b.dataset.i); });
      });
    } else {
      $('#go').addEventListener('click', answerFields);
      Array.prototype.forEach.call(document.querySelectorAll('.fin'), function (inp) {
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') answerFields(); });
      });
      setTimeout(function () { var f = document.querySelector('.fin'); if (f) f.focus(); }, 20);
    }

    startTimer(q.limit);
  }

  function startTimer(limit) {
    S.limit = limit; S.t = limit; S.locked = false;
    if (S.timer) clearInterval(S.timer);
    var bar = $('#tbar');
    bar.style.width = '100%';
    bar.className = '';
    S.timer = setInterval(function () {
      S.t -= 0.1;
      var pct = Math.max(0, S.t / S.limit) * 100;
      bar.style.width = pct + '%';
      bar.className = pct < 20 ? 'crit' : pct < 45 ? 'warn' : '';
      if (S.t <= 0) { clearInterval(S.timer); S.timer = null; timeUp(); }
    }, 100);
  }

  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

  // ── 채점 ────────────────────────────────────────
  function award(ok) {
    var q = S.qs[S.i];
    var bt = S.byType[q.type] || (S.byType[q.type] = [0, 0]);
    bt[1]++;
    var pts = 0;
    if (ok) {
      bt[0]++; S.correct++;
      S.streak++;
      var mult = S.streak >= 5 ? 2 : S.streak >= 3 ? 1.5 : 1;
      pts = Math.round((100 + Math.max(0, S.t) * 6) * mult);
      S.score += pts;
    } else {
      S.streak = 0;
    }
    return pts;
  }

  function finish(ok, pts, extra) {
    var q = S.qs[S.i];
    S.locked = true;
    stopTimer();

    var f = $('#flash');
    f.innerHTML =
      (ok ? '<span class="pts">+' + fmt(pts) + '</span>' : '') +
      '<div class="hd">' + (ok ? '정확하다' : (extra || '틀렸다')) + '</div>' +
      '<div class="why">' + q.why + '</div>';
    f.className = 'flash on ' + (ok ? 'good' : 'bad');

    $('#score').textContent = fmt(S.score);

    if (q.choose) {
      Array.prototype.forEach.call(document.querySelectorAll('.prow'), function (b) {
        var i = +b.dataset.i;
        if (i === q.choose.answer) b.classList.add('right');
        else if (i === S.picked) b.classList.add('wrong');
        b.disabled = true;
      });
    } else {
      Array.prototype.forEach.call(document.querySelectorAll('.fin'), function (inp) { inp.disabled = true; });
      var go = $('#go');
      go.textContent = S.i + 1 >= S.qs.length ? '결과 보기' : '다음 문제';
      go.onclick = next;
      // 금액을 공개한다
      Array.prototype.forEach.call(document.querySelectorAll('.prow .pamt'), function (el, i) {
        el.textContent = fmt(q.seats[i].bet);
      });
    }

    if (q.choose) {
      setTimeout(function () {
        var b = document.createElement('button');
        b.className = 'go'; b.type = 'button';
        b.style.margin = '0 16px 16px'; b.style.width = 'calc(100% - 32px)';
        b.textContent = S.i + 1 >= S.qs.length ? '결과 보기' : '다음 문제';
        b.addEventListener('click', next);
        $('#panel').appendChild(b);
        b.focus();
      }, 10);
    }
  }

  function next() { S.i++; render(); }

  function answerFields() {
    if (S.locked) return;
    var q = S.qs[S.i];
    var inputs = Array.prototype.slice.call(document.querySelectorAll('.fin'));
    var vals = inputs.map(function (i) {
      var r = (i.value || '').replace(/[^0-9]/g, '');
      return r === '' ? NaN : parseInt(r, 10);
    });
    if (vals.some(isNaN)) return;
    var ok = q.fields.every(function (f, i) { return vals[i] === f.answer; });
    finish(ok, award(ok));
  }

  function answerChoice(i) {
    if (S.locked) return;
    S.picked = i;
    var ok = i === S.qs[S.i].choose.answer;
    finish(ok, award(ok));
  }

  function timeUp() {
    if (S.locked) return;
    S.picked = -1;
    finish(false, award(false), '시간 초과');
  }

  // ── 결과 ────────────────────────────────────────
  function renderResult() {
    stopTimer();
    $('#tbar').style.width = '0%';
    var prev = bestScore();
    var isNew = S.score > prev;
    if (isNew) saveBest(S.score);

    var rows = Object.keys(S.byType).map(function (k) {
      var b = S.byType[k];
      return '<div class="r"><span class="k">' + TYPE_LABEL[k] + '</span>' +
        '<span class="v">' + b[0] + ' / ' + b[1] + '</span></div>';
    }).join('');

    $('#panel').innerHTML =
      '<div class="result">' +
        '<div class="big">' + fmt(S.score) + '</div>' +
        '<div class="lbl">점 · ' + S.correct + '/' + S.qs.length + ' 정답</div>' +
        (isNew ? '<div class="newrec">최고 기록 경신</div>'
               : '<div class="best">최고 기록 <b>' + fmt(prev) + '</b>점</div>') +
        '<div class="bytype">' + rows + '</div>' +
      '</div>' +
      '<div style="padding:0 16px 16px"><button class="go" id="again" type="button">다시 하기</button></div>';

    $('#again').addEventListener('click', reset);
    $('#qno').textContent = '완료';
  }

  reset();
})();
</script>
